<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Frost Crystal Contest</title>
<link rel="icon" href="icon.png">
<!-- Frost Crystal Contest (frost.html): two views of the contest's battlefields. Summary: laid out like the
     contest's map, each server one line of its top 10 by base CP, 100M and over one by one. Players: each
     server's top 20 by name. The bookmark's Read battlefields reads both in the game (the contest's own map, then
     each server's Individual CP Ranking) and keeps them on the Worker (api/frost-read) for everyone. -->
<style>
:root{--bg:#eef4f9;--card:#fff;--ink:#14212e;--dim:#62748a;--line:#dbe5ee;--head:#f4f8fb;--acc:#1789a8;--us:#e8f6ea;--usink:#1f7a3a;--bad:#b42318;
  --band1:#0b3b57;--band2:#1789a8;--band3:#8fd6e6}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0d151d;--card:#15212c;--ink:#e6eef5;--dim:#8ea2b5;--line:#243444;--head:#1a2835;--acc:#5cc6d6;--us:#173322;--usink:#7fd99a;--bad:#ff8a80}}
:root[data-theme="dark"]{--bg:#0d151d;--card:#15212c;--ink:#e6eef5;--dim:#8ea2b5;--line:#243444;--head:#1a2835;--acc:#5cc6d6;--us:#173322;--usink:#7fd99a;--bad:#ff8a80}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
.band{background:linear-gradient(135deg,var(--band1),var(--band2) 60%,var(--band3));color:#fff;padding:22px 16px 18px}
.band .in,.wrap{max-width:1280px;margin:0 auto}
.band h1{margin:0;font-size:24px;letter-spacing:.01em}
.band p{margin:4px 0 0;opacity:.85}
.band a{color:#fff}
.homelink{display:inline-flex;align-items:center;gap:6px;margin:0 0 10px;padding:4px 12px 4px 10px;border-radius:999px;font-size:13px;font-weight:600;
  text-decoration:none;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.35)}
.homelink:hover{background:rgba(255,255,255,.26)}
.wrap{padding:16px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.bar .grow{flex:1}
/* on a phone: the tabs and Download CSV on one line, the status on its own line below */
@media (max-width:640px){.bar .status{order:3;flex-basis:100%}.bar #csv{margin-left:auto}}
button,.btn{font:inherit;font-weight:600;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:7px 12px;cursor:pointer}
button.pri{background:var(--acc);border-color:var(--acc);color:#fff}
button:disabled{opacity:.55;cursor:default}
.status{color:var(--dim)}
.status.bad{color:var(--bad)}
/* the battlefields as the contest's map lays them out: one in the middle, then one left and one right */
:root{--b1:#dbe6fb;--b1l:#b9cdf3;--b2:#e6def2;--b2l:#cdbfe3;--b3:#dfecd9;--b3l:#bfd8b4}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--b1:#1b2840;--b1l:#2c4166;--b2:#2a2238;--b2l:#44385c;--b3:#1f2e22;--b3l:#34503a}}
:root[data-theme="dark"]{--b1:#1b2840;--b1l:#2c4166;--b2:#2a2238;--b2l:#44385c;--b3:#1f2e22;--b3l:#34503a}
.map{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px 16px}
.bf{grid-column:2 / span 2;background:var(--bg1);border:1px solid var(--bl);border-radius:10px;overflow:hidden;--bg1:var(--b1);--bl:var(--b1l)}
.bf.l{grid-column:1 / span 2;--bg1:var(--b2);--bl:var(--b2l)}
.bf.r{grid-column:3 / span 2;--bg1:var(--b3);--bl:var(--b3l)}
@media (max-width:820px){.map{grid-template-columns:minmax(0,1fr)}.bf,.bf.l,.bf.r{grid-column:auto}}
.bf h2{margin:0;padding:8px 12px;font-size:15px}
.bf ul{list-style:none;margin:0;padding:0}
.bf li{display:flex;gap:10px;padding:6px 12px;border-top:1px solid var(--bl);font-size:14px;font-variant-numeric:tabular-nums}
.bf li b{flex:none;min-width:3.6em}
.bf li.us{font-weight:700;color:var(--usink)}
/* one tab per contest date, then the date's two views: Summary (the battlefields as lines) and Players
   (each server's top 20 by name) */
.days{display:flex;gap:4px;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;margin:0 0 14px;box-shadow:inset 0 -1px 0 var(--line)}
.days::-webkit-scrollbar{display:none}
.days button{flex:none;border:0;border-bottom:3px solid transparent;border-radius:0;padding:8px 14px;background:transparent;color:var(--dim);font-size:15px}
.days button.on{color:var(--ink);border-bottom-color:var(--acc)}
.days[hidden]{display:none}
/* Battle: a snapshot per Read battle, picked by its time */
.snaps{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:0 0 14px;font-size:13px;color:var(--dim)}
.snaps button{padding:4px 11px;border-radius:999px;font-weight:600;font-size:12.5px}
.snaps button.on{background:var(--acc);border-color:var(--acc);color:#fff}
.mask{font-size:12px;margin-left:4px;cursor:help}
.bf .stats{padding:0 12px 8px;font-size:12.5px;color:var(--dim)}
.bf .stats b{color:var(--ink)}
.bf li .who{color:var(--dim)}
.bf li.empty{color:var(--dim)}
/* Ranking: the battle's servers and players, as the site's cards look */
.rapp{color-scheme:dark;color:#f3f3f7;background:rgba(22,22,30,.97);border-radius:18px;box-shadow:0 12px 40px rgba(0,0,0,.25),inset 0 0 0 2px rgba(224,69,123,.55);overflow:hidden}
.rhead{display:flex;align-items:center;gap:10px;padding:12px 14px 8px;flex-wrap:wrap}
.rhead b{font-size:15.5px}
.rsearch{flex:1;min-width:160px;display:flex;gap:8px;align-items:center;background:rgba(255,255,255,.08);border-radius:999px;padding:6px 14px;margin:0}
.rsearch:focus-within{box-shadow:inset 0 0 0 2px rgba(224,69,123,.85)}
.rsearch input{flex:1;min-width:0;border:0;outline:0;background:none;color:#fff;font:inherit;font-size:15px;padding:0;caret-color:#fff}
.rreads{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:0 14px 8px;font-size:12.5px;color:rgba(235,235,245,.65)}
.rbar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:0 14px 10px}
.rchip{border:0;background:rgba(255,255,255,.08);color:#f3f3f7;border-radius:999px;padding:5px 12px;font:inherit;font-size:12.5px;font-weight:400;cursor:pointer}
.rchip.on{background:rgba(195,20,65,.35);box-shadow:inset 0 0 0 1px #e0457b}
.rcount{margin-left:auto;font-size:12.5px;color:rgba(235,235,245,.5)}
.rbody{overflow:auto;padding:0 14px 14px}
.rtable{width:100%;border-collapse:collapse;font-size:13.5px}
.rtable th{position:sticky;top:0;background:#20212c;text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:rgba(235,235,245,.6);padding:8px 10px;font-weight:600;white-space:nowrap}
.rtable th.n,.rtable td.n{text-align:right;font-variant-numeric:tabular-nums}
.rtable td{padding:7px 10px;border-top:1px solid rgba(255,255,255,.08);white-space:nowrap;color:#f3f3f7}
.rtable tr.us td{background:rgba(126,226,168,.12);color:#8ff0b5;font-weight:700}
.rtable td.up{color:#8ff0b5;font-size:12.5px}
.rtable .rdim{color:rgba(235,235,245,.45)}
.tabs{display:inline-flex;gap:2px;padding:3px;border-radius:10px;background:var(--line)}
.tabs button{border:0;border-radius:8px;padding:6px 14px;background:transparent;color:var(--dim)}
.tabs button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.field{margin:0 0 22px}
.field h2{margin:0 0 8px;font-size:16px;display:flex;flex-wrap:wrap;gap:6px 12px;align-items:baseline}
.field h2 small{font-weight:500;color:var(--dim);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:1100px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.grid{grid-template-columns:minmax(0,1fr)}}
.srv{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.srv.us{border-color:var(--usink)}
.srv .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:9px 11px;background:var(--head);border-bottom:1px solid var(--line)}
.srv .top b{font-size:15px}
.srv.us .top{background:var(--us)}
.srv.us .top b{color:var(--usink)}
.srv .place{font-size:12px;font-weight:700;color:var(--dim);margin-right:6px}
.srv .sum{font-size:12px;color:var(--dim);text-align:right}
.srv .sum strong{color:var(--ink);font-size:13px}
table{width:100%;border-collapse:collapse;font-size:13px}
td{padding:4px 8px;border-top:1px solid var(--line);white-space:nowrap}
tr:first-child td{border-top:0}
td.n{color:var(--dim);width:1%;text-align:right}
td.nm{overflow:hidden;text-overflow:ellipsis;max-width:0;width:80%}
td.cp{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.empty{padding:14px 11px;color:var(--dim)}
.skel{height:200px;border-radius:10px;background:linear-gradient(90deg,var(--card),var(--head),var(--card));background-size:200% 100%;animation:sk 1.4s linear infinite;border:1px solid var(--line)}
@keyframes sk{to{background-position:-200% 0}}
</style>
</head>
<body>
<div class="band"><div class="in">
  <a class="homelink" id="homeLink" href="./"><span aria-hidden="true">←</span>Home</a>
  <h1>Frost Crystal Contest</h1>
</div></div>
<div class="wrap">
  <div class="days" id="days" role="tablist" hidden></div>
  <div class="bar">
    <div class="tabs" role="tablist"><button type="button" id="tabSum" role="tab">Summary</button><button type="button" id="tabPl" role="tab">Players</button><button type="button" id="tabBt" role="tab">Battle</button><button type="button" id="tabRk" role="tab">Ranking</button></div>
    <span class="status grow" id="status">Loading…</span>
    <button type="button" id="csv" disabled>Download CSV</button>
  </div>
  <div id="out"></div>
</div>
<script>
// inside the site (index.html#frost) the site's own header has the way back
if (window.frameElement) document.getElementById('homeLink').remove();
</script>
<script>
(function () {
  const API = location.hostname.endsWith('.workers.dev') ? '/api' : 'https://data-collection.jk06nm04.workers.dev/api';
  const US = '2698', TOP = 10, BIG = 100e6, LONG = 20;   // Summary: each server's top 10, 100M and over one by one; Players: its top 20
  const $ = id => document.getElementById(id);
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
  const M = v => Math.round(v / 1e6) + 'M';
  let days = {}, day = '', read = null;            // every contest date's read; the date shown and its read {fields, servers, at}
  let bdays = {}, snapAt = null, rkWhat = 'servers', rkQ = '';                    // every contest date's battle snapshots; the one picked (its time), else the latest

  const top = (s, n = TOP) => ((read.servers || {})[s] || []).slice(0, n);
  const total = (s, n = TOP) => top(s, n).reduce((a, p) => a + p[1], 0);
  const M1 = v => (v / 1e6).toFixed(1) + 'M';
  // the view last picked, on this device
  let view = 'sum';
  try { const v = localStorage.getItem('frost.view'); if (v === 'pl' || v === 'bt' || v === 'rk') view = v; } catch {}
  async function load() {
    $('out').innerHTML = '<div class="map">' + '<div class="skel bf"></div>'.repeat(3) + '</div>';
    try {
      const post = path => fetch(API + path, { method: 'POST', headers: { 'content-type': 'application/json' }, body: '{}' });
      const [r, rb] = await Promise.all([post('/frost-read'), post('/frost-battle').catch(() => null)]);
      const j = await r.json().catch(() => null);
      if (!r.ok) throw new Error((j && j.error) || 'the read could not be fetched (' + r.status + ')');
      days = (j && j.days) || {};
      const jb = rb && rb.ok ? await rb.json().catch(() => null) : null;
      bdays = (jb && jb.days) || {};
      const dates = [...new Set([...Object.keys(days), ...Object.keys(bdays)])].sort();
      if (!dates.length) {
        $('status').textContent = 'Nothing read yet.';
        $('out').innerHTML = '<div class="empty">Open the game and tap <b>Read battlefields</b> in the 2698 Data Extractor bookmark: it reads the contest\'s map and the top 20 of every server on it.</div>';
        return;
      }
      day = dates[dates.length - 1];                // the latest contest first
      $('days').hidden = false; read = days[day] || null; draw(); $('csv').disabled = false;
    } catch (e) {
      $('status').className = 'status grow bad'; $('status').textContent = '✗ ' + (e.message || e);
      $('out').innerHTML = '';
    }
  }

  // a server's line: its players of 100M and over one by one, the rest of its top 10 as "highest to lowest"
  function line(s) {
    const t = top(s).map(p => p[1]);
    if (!t.length) return 'not read';
    const big = t.filter(v => v >= BIG - 5e5), rest = t.slice(big.length);
    return big.map(M).concat(rest.length ? [rest.length > 1 ? `${M(rest[0])} to ${M(rest[rest.length - 1])}` : M(rest[0])] : []).join(', ');
  }

  const dayName = d => new Date(d + 'T00:00:00Z').toLocaleDateString([], { day: 'numeric', month: 'short', timeZone: 'UTC' });
  function draw() {
    $('days').innerHTML = [...new Set([...Object.keys(days), ...Object.keys(bdays)])].sort().map(d =>
      `<button type="button" role="tab" data-day="${esc(d)}" class="${d === day ? 'on' : ''}" aria-selected="${d === day}">${esc(dayName(d))}</button>`).join('');
    for (const [id, v] of [['tabSum', 'sum'], ['tabPl', 'pl'], ['tabBt', 'bt'], ['tabRk', 'rk']]) { $(id).classList.toggle('on', view === v); $(id).setAttribute('aria-selected', view === v); }
    if (view === 'bt') return drawBattle();
    if (view === 'rk') return drawRanking();
    if (!read) { $('status').textContent = 'No battlefields read for this date.'; $('out').innerHTML = '<div class="empty">Tap <b>Read battlefields</b> in the bookmark for this contest\'s top 20s.</div>'; return; }
    const t = new Date(read.at).toLocaleString([], { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
    $('status').textContent = `${read.fields.flat().length} servers · top ${view === 'sum' ? TOP : LONG} by base CP · read from the game ${t}`;
    if (view === 'pl') return drawPlayers();
    $('out').innerHTML = '<div class="map">' + read.fields.map((f, i) => {
      const ranked = f.slice().sort((a, b) => total(b) - total(a));
      return `<section class="bf${['', ' l', ' r'][i % 3]}"><h2>Battlefield ${i + 1}: ${ranked.map(esc).join(', ')}</h2>
        <ul>${ranked.map(s => `<li${s === US ? ' class="us"' : ''}><b>${esc(s)}:</b><span>${line(s)}</span></li>`).join('')}</ul></section>`;
    }).join('') + '</div>';
  }

  // Players: each battlefield's servers ranked by their top 20, every player by name
  function card(s, place) {
    const t = top(s, LONG), sum = t.reduce((a, p) => a + p[1], 0);
    return `<div class="srv${s === US ? ' us' : ''}"><div class="top"><b><span class="place">#${place}</span>S${esc(s)}</b>
      <span class="sum">Top ${LONG} <strong>${t.length ? M1(sum) : '—'}</strong>${t.length ? `<br>avg ${M1(sum / t.length)}` : ''}</span></div>
      ${t.length ? `<table>${t.map((p, i) => `<tr><td class="n">${i + 1}</td><td class="nm" title="${esc(p[0])}">${esc(p[0])}</td><td class="cp">${M1(p[1])}</td></tr>`).join('')}</table>`
        : '<div class="empty">This server was not read.</div>'}</div>`;
  }
  function drawPlayers() {
    $('out').innerHTML = read.fields.map((f, i) => {
      const ranked = f.slice().sort((a, b) => total(b, LONG) - total(a, LONG));
      return `<section class="field"><h2>Battlefield ${i + 1}<small>${f.map(s => 'S' + esc(s)).join(' · ')}</small></h2>
        <div class="grid">${ranked.map((s, j) => card(s, j + 1)).join('')}</div></section>`;
    }).join('');
  }
  // Battle: the snapshot picked; the servers by crystals (with the change since the snapshot before, and the
  // whole hour as a line), each battlefield's mines and who holds them, and our players by score
  const N = v => Number(v || 0).toLocaleString('en-US');
  const hm = t => new Date(t).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  const maskIcon = '<span class="mask" title="Master Thief: masked in the game">🎭</span>';
  function drawBattle() {
    const list = bdays[day] || [];
    if (!list.length) {
      $('status').textContent = 'No battle read for this date.';
      $('out').innerHTML = '<div class="empty">During the contest\'s battle, tap <b>Read battle</b> in the 2698 Data Extractor bookmark. Each tap adds a snapshot here; tap it every so often to follow the hour.</div>';
      return;
    }
    let i = list.findIndex(x => x.at === snapAt); if (i < 0) i = list.length - 1;
    const sn = list[i];
    $('status').textContent = `Battle · ${list.length} ${list.length === 1 ? 'snapshot' : 'snapshots'} · this one read ${hm(sn.at)}`;
    const fields = '<div class="map">' + sn.status.map((f, k) => {
      const us = f.us || {};
      return `<section class="bf${['', ' l', ' r'][k % 3]}"><h2>Battlefield ${k + 1}</h2>
        <p class="stats"><b>${N(f.players)}</b> players (${N(us.players)} ours) · <b>${N(f.masked)}</b> masked (${N(us.masked)} ours) · <b>${N(f.freeOre)}</b> free ore · our crystals <b>${N(us.crystals)}</b></p>
        <ul>${f.mines.map((m, j) => {
          const sp = m.spot != null ? m.spot : f.servers[j], spot = sp ? 'S' + esc(sp) : 'Open spot';   // the mine's own server spot
          if (!m.server) return `<li class="empty"><b>${spot}:</b><span>empty</span></li>`;
          return `<li${String(m.server) === US ? ' class="us"' : ''}><b>${spot}:</b><span>S${esc(m.server)} · ${N(m.players)} ${m.players === 1 ? 'player' : 'players'}${m.name ? ` <span class="who">· ${esc(m.name)}${m.masked ? maskIcon : ''}${m.power ? ' ' + M(m.power) : ''}</span>` : m.masked ? ' ' + maskIcon : ''}</span></li>`;
        }).join('')}</ul></section>`;
    }).join('') + '</div>';
    $('out').innerHTML = `<div class="snaps">Read at ${list.map(x => `<button type="button" data-snap="${x.at}" class="${x === sn ? 'on' : ''}">${hm(x.at)}</button>`).join('')}</div>${fields}`;
  }
  // Ranking: the battle's Warzone Ranking (servers by crystals, the change since the read before) and its
  // Individual Ranking (our players by score), one read at a time, as the site's cards look
  function drawRanking() {
    const list = bdays[day] || [];
    if (!list.length) { drawBattle(); return; }
    let i = list.findIndex(x => x.at === snapAt); if (i < 0) i = list.length - 1;
    const sn = list[i], prev = list[i - 1], q = rkQ.toLowerCase();
    $('status').textContent = `Ranking · ${list.length} ${list.length === 1 ? 'read' : 'reads'} · this one ${hm(sn.at)}`;
    const was = {}; if (prev) for (const x of prev.servers) was[x.server] = x.crystals;
    let rows, head, n, total;
    if (rkWhat === 'servers') {
      const l = sn.servers.filter(x => !q || ('s' + x.server).includes(q.replace(/^s?/, 's')));
      n = l.length; total = sn.servers.length;
      head = `<th class="n">#</th><th>Server</th><th class="n">Crystals</th><th class="n">${prev ? 'Since ' + hm(prev.at) : ''}</th>`;
      rows = l.map(x => { const d = prev && was[x.server] != null ? x.crystals - was[x.server] : 0;
        return `<tr class="${String(x.server) === US ? 'us' : ''}"><td class="n">${x.rank}</td><td>S${esc(x.server)}</td><td class="n">${N(x.crystals)}</td><td class="n up">${d ? '+' + N(d) : ''}</td></tr>`; });
    } else {
      const l = sn.players.filter(p => !q || String(p.name).toLowerCase().includes(q));
      n = l.length; total = sn.players.length;
      head = `<th class="n">#</th><th>Name</th><th class="n">Score</th><th class="n">Merit</th>`;
      rows = l.map(p => `<tr><td class="n">${p.rank}</td><td>${esc(p.name || 'Master Thief')}${p.masked ? maskIcon : ''}</td><td class="n">${N(p.score)}</td><td class="n">${N(p.merit)}</td></tr>`);
    }
    $('out').innerHTML = `<div class="rapp"><div class="rhead"><b>Frost Crystal ranking</b>
        <label class="rsearch"><span aria-hidden="true">🔍</span><input id="rkQ" type="text" placeholder="${rkWhat === 'servers' ? 'Search a server' : 'Search a name'}" autocomplete="off" value="${esc(rkQ)}"></label></div>
      <div class="rreads">Read at ${list.map(x => `<button type="button" class="rchip ${x === sn ? 'on' : ''}" data-snap="${x.at}">${hm(x.at)}</button>`).join('')}</div>
      <div class="rbar"><button type="button" class="rchip ${rkWhat === 'servers' ? 'on' : ''}" data-rk="servers">Servers</button><button type="button" class="rchip ${rkWhat === 'players' ? 'on' : ''}" data-rk="players">S${US} players</button>
        <span class="rcount">${n === total ? N(total) : N(n) + ' of ' + N(total)} ${rkWhat === 'servers' ? 'servers' : 'players'}</span></div>
      <div class="rbody"><table class="rtable"><thead><tr>${head}</tr></thead><tbody>${rows.join('') || `<tr><td colspan="4" class="rdim">No ${rkWhat === 'servers' ? 'server' : 'player'} matches.</td></tr>`}</tbody></table></div></div>`;
    const inp = $('rkQ'); inp.oninput = () => { rkQ = inp.value; const at = inp.selectionStart; drawRanking(); const k = $('rkQ'); k.focus(); k.setSelectionRange(at, at); };
  }
  $('out').addEventListener('click', e => {
    const b = e.target.closest('[data-snap]'); if (b) { snapAt = +b.dataset.snap; view === 'rk' ? drawRanking() : drawBattle(); }
    const r = e.target.closest('[data-rk]'); if (r) { rkWhat = r.dataset.rk; rkQ = ''; drawRanking(); }
  });
  const pick = v => { view = v; try { localStorage.setItem('frost.view', v); } catch {} draw(); };
  $('days').onclick = e => { const b = e.target.closest('[data-day]'); if (b && (days[b.dataset.day] || bdays[b.dataset.day])) { day = b.dataset.day; read = days[day] || null; snapAt = null; draw(); } };
  $('tabBt').onclick = () => pick('bt');
  $('tabRk').onclick = () => pick('rk');
  $('tabSum').onclick = () => pick('sum');
  $('tabPl').onclick = () => pick('pl');
  draw();

  $('csv').onclick = () => {
    const q = v => /[",\n]/.test(v) ? '"' + String(v).replace(/"/g, '""') + '"' : v;
    if (view === 'bt' || view === 'rk') {
      const list = bdays[day] || [], sn = list.find(x => x.at === snapAt) || list[list.length - 1];
      if (!sn) return;
      const rows = [['Kind', 'Rank', 'Server', 'Name', 'Crystals / score', 'Masked']]
        .concat(sn.servers.map(x => ['Server', x.rank, x.server, '', x.crystals, '']), sn.players.map(p => ['Player', p.rank, p.server, p.name, p.score, p.masked ? 'yes' : '']));
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob(['\ufeff' + rows.map(r => r.map(q).join(',')).join('\n')], { type: 'text/csv' }));
      a.download = `frost-battle-${day}-${new Date(sn.at).toISOString().slice(11, 16).replace(':', '')}.csv`;
      a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
      return;
    }
    if (!read) return;
    const rows = [['Battlefield', 'Server', 'Rank', 'Name', 'Base CP']];
    const n = view === 'sum' ? TOP : LONG;
    read.fields.forEach((f, i) => f.forEach(s => top(s, n).forEach((p, j) => rows.push([i + 1, s, j + 1, p[0], p[1]]))));
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob(['﻿' + rows.map(r => r.map(q).join(',')).join('\n')], { type: 'text/csv' }));
    a.download = `frost-crystal-${day}-top${n}.csv`;
    a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  };
  load();
})();
</script>
</body>
</html>
