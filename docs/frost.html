<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Frost Crystal Contest</title>
<link rel="icon" href="icon.png">
<link rel="stylesheet" href="fonts.css?v=1">
<style>
:root{--bg:#eef4f9;--card:#fff;--ink:#14212e;--dim:#62748a;--line:#dbe5ee;--head:#f4f8fb;--acc:#1789a8;--us:#e8f6ea;--usink:#1f7a3a;--bad:#b42318;
  --band1:#0b3b57;--band2:#1789a8;--band3:#8fd6e6}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0d151d;--card:#15212c;--ink:#e6eef5;--dim:#8ea2b5;--line:#243444;--head:#1a2835;--acc:#5cc6d6;--us:#173322;--usink:#7fd99a;--bad:#ff8a80}}
:root[data-theme="dark"]{--bg:#0d151d;--card:#15212c;--ink:#e6eef5;--dim:#8ea2b5;--line:#243444;--head:#1a2835;--acc:#5cc6d6;--us:#173322;--usink:#7fd99a;--bad:#ff8a80}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.4 Selawik,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
.band{background:linear-gradient(135deg,var(--band1),var(--band2) 60%,var(--band3));color:#fff;padding:22px 16px 18px}
.band .in,.wrap{max-width:1280px;margin:0 auto}
.band h1{margin:0;font-size:24px;letter-spacing:.01em}
.band p{margin:4px 0 0;opacity:.85}
.band a{color:#fff}
.homelink{display:inline-flex;align-items:center;gap:6px;margin:0 0 10px;padding:4px 12px 4px 10px;border-radius:999px;font-size:13px;font-weight:600;
  text-decoration:none;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.35)}
.homelink:hover{background:rgba(255,255,255,.26)}
.wrap{padding:16px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.bar .grow{flex:1}
@media (max-width:640px){.bar .status{order:3;flex-basis:100%}.bar #csv{margin-left:auto}}
button,.btn{font:inherit;font-weight:600;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:7px 12px;cursor:pointer}
button.pri{background:var(--acc);border-color:var(--acc);color:#fff}
button:disabled{opacity:.55;cursor:default}
.status{color:var(--dim)}
.status.bad{color:var(--bad)}
:root{--b1:#dbe6fb;--b1l:#b9cdf3;--b2:#e6def2;--b2l:#cdbfe3;--b3:#dfecd9;--b3l:#bfd8b4}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--b1:#1b2840;--b1l:#2c4166;--b2:#2a2238;--b2l:#44385c;--b3:#1f2e22;--b3l:#34503a}}
:root[data-theme="dark"]{--b1:#1b2840;--b1l:#2c4166;--b2:#2a2238;--b2l:#44385c;--b3:#1f2e22;--b3l:#34503a}
.map{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px 16px}
.bf{grid-column:2 / span 2;background:var(--bg1);border:1px solid var(--bl);border-radius:10px;overflow:hidden;--bg1:var(--b1);--bl:var(--b1l)}
.bf.l{grid-column:1 / span 2;--bg1:var(--b2);--bl:var(--b2l)}
.bf.r{grid-column:3 / span 2;--bg1:var(--b3);--bl:var(--b3l)}

.bf h2{margin:0;padding:8px 12px;font-size:15px}
.bf ul{list-style:none;margin:0;padding:0}
.bf li{display:flex;gap:10px;padding:6px 12px;border-top:1px solid var(--bl);font-size:14px;font-variant-numeric:tabular-nums}
.bf li b{flex:none;min-width:3.6em}
.bf li.us{font-weight:700;color:var(--usink)}
.days{display:flex;gap:4px;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;margin:0 0 14px;box-shadow:inset 0 -1px 0 var(--line)}
.days::-webkit-scrollbar{display:none}
.days button{flex:none;border:0;border-bottom:3px solid transparent;border-radius:0;padding:8px 14px;background:transparent;color:var(--dim);font-size:15px}
.days button.on{color:var(--ink);border-bottom-color:var(--acc)}
.days[hidden]{display:none}
:root{--won:#1f9d55;--wonbg:#e3f5ea;--lose:#d64545;--losebg:#fbe7e7;--oth:#6b7f94;--othbg:#eef2f6}

:root[data-theme="dark"]{--won:#5fd38d;--wonbg:#16301f;--lose:#ff7a7a;--losebg:#3a1d22;--oth:#9fb1c4;--othbg:#1d2a37}
h2.sec{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--dim);margin:18px 2px 8px}
h2.sec:first-child{margin-top:0}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}

.tile{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}

.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}

.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.panel h3{margin:0 0 10px;font-size:14px}
.hb{display:grid;grid-template-columns:110px minmax(0,1fr) 80px;gap:8px;align-items:center;font-size:13px;margin:5px 0}
.hbar{height:12px;border-radius:6px;background:var(--othbg);overflow:hidden}

.bf.bt{background:var(--card);border-color:var(--line)}

.bf .stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;padding:10px 12px 4px;font-size:inherit;color:inherit}

.gi{display:inline-block;object-fit:contain;vertical-align:middle;flex:none}
.mask{margin-left:5px;cursor:help}
.gi.mk{width:20px;height:13px;vertical-align:-2px}
.gi.cr{width:16px;height:16px;vertical-align:-3px;margin-right:3px}
.v .gi.cr{width:22px;height:22px;vertical-align:-3px;margin-right:4px}

h2.sec .gi,.panel h3 .gi{width:22px;height:22px;margin-right:6px;vertical-align:-5px}
.rapp{color-scheme:dark;color:#f3f3f7;background:rgba(22,22,30,.97);border-radius:18px;box-shadow:0 12px 40px rgba(0,0,0,.25),inset 0 0 0 2px rgba(224,69,123,.55);overflow:hidden}

.rbar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:0 14px 10px}

.rchip.on{background:rgba(195,20,65,.35);box-shadow:inset 0 0 0 1px #e0457b}
.rcount{margin-left:auto;font-size:12.5px;color:rgba(235,235,245,.5)}
.rbody{overflow:auto;padding:0 14px 14px}
.rtable{width:100%;border-collapse:collapse;font-size:13.5px}
.rtable th{position:sticky;top:0;background:#20212c;text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:rgba(235,235,245,.6);padding:8px 10px;font-weight:600;white-space:nowrap}
.rtable th.n,.rtable td.n{text-align:right;font-variant-numeric:tabular-nums}
.rtable td{padding:7px 10px;border-top:1px solid rgba(255,255,255,.08);white-space:nowrap;color:#f3f3f7}
.rtable tr.us td{background:rgba(126,226,168,.12);color:#8ff0b5;font-weight:700}
.rtable td.up{color:#8ff0b5;font-size:12.5px}
.rtable .rdim{color:rgba(235,235,245,.45)}
.tabs[hidden]{display:none}
.rclear{flex:none;width:22px;height:22px;display:grid;place-items:center;border:0;border-radius:50%;padding:0;background:rgba(255,255,255,.16);color:#fff;font-size:12px;line-height:1;cursor:pointer}
.rclear:hover{background:rgba(255,255,255,.28)}
.rclear[hidden]{display:none}
.tabs{display:inline-flex;gap:2px;padding:3px;border-radius:10px;background:var(--line)}
.tabs button{border:0;border-radius:8px;padding:6px 14px;background:transparent;color:var(--dim)}
.tabs button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.field{margin:0 0 22px}
.field h2{margin:0 0 8px;font-size:16px;display:flex;flex-wrap:wrap;gap:6px 12px;align-items:baseline}
.field h2 small{font-weight:500;color:var(--dim);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:1100px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.grid{grid-template-columns:minmax(0,1fr)}}
.srv{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.srv.us{border-color:var(--usink)}
.srv .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:9px 11px;background:var(--head);border-bottom:1px solid var(--line)}
.srv .top b{font-size:15px}
.srv.us .top{background:var(--us)}
.srv.us .top b{color:var(--usink)}
.srv .place{font-size:12px;font-weight:700;color:var(--dim);margin-right:6px}
.srv .sum{font-size:12px;color:var(--dim);text-align:right}
.srv .sum strong{color:var(--ink);font-size:13px}
table{width:100%;border-collapse:collapse;font-size:13px}
td{padding:4px 8px;border-top:1px solid var(--line);white-space:nowrap}
tr:first-child td{border-top:0}
td.n{color:var(--dim);width:1%;text-align:right}
.rtable td.n{color:#f3f3f7}
.rtable td.n.rdim{color:rgba(235,235,245,.45)}
td.nm{overflow:hidden;text-overflow:ellipsis;max-width:0;width:80%}
td.cp{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.empty{padding:14px 11px;color:var(--dim)}
.skel{height:200px;border-radius:10px;background:linear-gradient(90deg,var(--card),var(--head),var(--card));background-size:200% 100%;animation:sk 1.4s linear infinite;border:1px solid var(--line)}
.skl{display:grid;gap:6px;padding:14px;border-radius:18px;background:rgba(22,22,30,.97)}
.skl i{display:block;height:34px;border-radius:8px;background:linear-gradient(90deg,rgba(255,255,255,.04),rgba(255,255,255,.09),rgba(255,255,255,.04));background-size:200% 100%;animation:sk 1.4s linear infinite}
@keyframes sk{to{background-position:-200% 0}}
.rapp{font:14px/1.45 Selawik,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;min-height:560px}
.rsearch{padding-right:6px;transition:box-shadow .15s ease}
.rsearch input{border-radius:0;line-height:22px;width:auto}
.rgo{width:auto;flex:none;border:0;border-radius:999px;padding:7px 14px;font:inherit;font-weight:700;color:#fff;cursor:pointer;background:rgba(255,255,255,.12)}
.rgo:hover{background:rgba(255,255,255,.2)}
.rsheet{flex:none;display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:7px 13px;font-weight:700;font-size:13.5px;text-decoration:none;color:#fff;background:rgba(255,255,255,.12)}
.rsheet:hover{background:rgba(255,255,255,.2)}
.rsheet svg{width:15px;height:15px}
.rreads{gap:6px 14px}
.rchip{font-weight:400}
.rbody{flex:1}
.rtable th{cursor:pointer;border:0}
.rtable td{border-top:0;border-bottom:1px solid rgba(255,255,255,.08)}
.wbtable{border-collapse:separate;border-spacing:0;min-width:100%;width:auto}
.wbtable th.n{text-align:right}
.wbtable td{background:#1a1a23}
.wbtable th:first-child,.wbtable td:first-child{position:sticky;left:0;z-index:1}
.rbody{clip-path:inset(0 14px)}

.wbtable th:first-child{z-index:3}
.wbtable td:first-child{box-shadow:1px 0 0 rgba(255,255,255,.08),-2px 0 0 #1a1a23}

.wbtable tr.us td:first-child{box-shadow:1px 0 0 rgba(255,255,255,.08),-2px 0 0 #1d2a23}
.bar[hidden]{display:none}
@media (max-width:640px){.rapp{border-radius:14px}}
.rtag{display:inline-block;border-radius:6px;padding:1px 7px;font-size:12px;font-weight:700;background:#3a3a3a;color:#ddd}
.rtag.tLeft{background:transparent;color:#8a8f99;box-shadow:inset 0 0 0 1px #4a4f58}.rtag.t698N{background:#22324f;color:#9ec5ff}.rtag.t698S{background:#3b2340;color:#e9a8ff}.rtag.t698W{background:#203d33;color:#7ee2a8}.rtag.t698C{background:#45321b;color:#ffc078}
.upd{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px 3px 8px;font-size:12px;font-weight:600;white-space:nowrap;
  background:rgba(126,226,168,.12);color:#7ee2a8;box-shadow:inset 0 0 0 1px rgba(126,226,168,.28)}

.upd.lt{background:var(--wonbg);color:var(--won);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--won) 35%,transparent)}

</style>

<body>
<div class="band"><div class="in">
  <a class="homelink" id="homeLink" href="./"><span aria-hidden="true">←</span>Home</a>
  <h1>Frost Crystal Contest</h1>
</div></div>
<div class="wrap">
  <div class="days" id="days" role="tablist" hidden></div>
  <div class="bar" id="bar" hidden>
    <div class="tabs" role="tablist"><button type="button" id="tabSum" role="tab">Battlefield Summary</button><button type="button" id="tabPl" role="tab">Top 20 (All servers)</button><button type="button" id="tabBt" role="tab">Battle Results</button><button type="button" id="tabRk" role="tab">Ranking</button></div>
    <span class="status" id="status">Loading…</span><span id="upd" class="grow"></span>
    <button type="button" id="csv" disabled>Download CSV</button>
  </div>
  <div id="out"></div>
</div>

if (window.frameElement) document.getElementById('homeLink').remove();
</script>
<script>
(function () {
  const API = location.hostname.endsWith('.workers.dev') ? '/api' : 'https://data-collection.jk06nm04.workers.dev/api';
  const US = '2698', TOP = 10, BIG = 100e6, LONG = 20;
  const $ = id => document.getElementById(id);
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
  const M = v => Math.round(v / 1e6) + 'M';
  let days = {}, day = '', read = null;
  let bdays = {}, rkWhat = 'servers', rkQ = '';
  const ALL = 'all';
  const fold = s => String(s || '').normalize('NFKC').toLowerCase().replace(/о/g, 'o').replace(/[^\p{L}\p{N}]/gu, '');
  let snames = [new Map(), new Map()];
  function nameMap(list) {
    const m = new Map(), weakKeys = new Set();
    for (const [name, , search, weak] of list || []) for (const k of [name, '~' + fold(name)]) {
      if (weak && m.has(k) && !weakKeys.has(k)) continue;
      m.set(k, search); weak ? weakKeys.add(k) : weakKeys.delete(k);
    }
    const bare = new Map();
    for (const [name, , search] of list || []) { const b = Who.untag(name); if (b) bare.set(b, bare.has(b) && bare.get(b) !== search ? null : search); }
    for (const [b, s] of bare) if (s && !m.has(b)) { m.set(b, s); if (!m.has('~' + fold(b))) m.set('~' + fold(b), s); }
    return m;
  }
  const searchOf = (name, key) => { if (key) { const s = who.search(key); if (s !== undefined) return s; } for (const m of snames) { const s = m.get(name) || (fold(name) !== '' && m.get('~' + fold(name))); if (s) return s; } return ''; };
  const nameCell = name => esc(name);
  const AL = (() => { try { const a = JSON.parse(localStorage.getItem('site.settings')).alliances; if (Array.isArray(a) && a.length) return a; } catch {} return ['698N', '698S', '698W', '698C']; })();
  let al = '', mk = false;
  const allyTag = a => a ? `<span class="rtag t${esc(a)}">${esc(a)}</span>` : '<span class="rdim">—</span>';
  const inAl = ally => !al || (al === 'OTHER' ? !AL.includes(ally) : ally === al);
  const chips = () => ['', ...AL, 'OTHER'].map(a => `<button type="button" class="rchip${al === a ? ' on' : ''}" data-al="${esc(a)}">${a === 'OTHER' ? 'Other' : esc(a) || 'Everyone'}</button>`).join('')
    + `<button type="button" class="rchip${mk ? ' on' : ''}" data-mk title="Only the players masked as Master Thief"><img class="gi mk" alt="" src="art/thief.png"> Masked</button>`;
  const sorts = {};
  function sorted(id, rows, val, def) {
    const s = sorts[id] || (sorts[id] = { k: def, asc: false }), v = val[s.k] || val[def], dir = s.asc ? 1 : -1;
    return rows.slice().sort((a, b) => { const x = v(a), y = v(b); return (typeof x === 'string' ? x.localeCompare(y) : (x ?? -1) - (y ?? -1)) * dir; });
  }
  const th = (id, k, label, num) => { const s = sorts[id] || {}; return `<th class="${num ? 'n' : ''}" data-sort="${id}:${esc(k)}">${label}${s.k === k ? (s.asc ? ' ▲' : ' ▼') : ''}</th>`; };

        .concat(sn.servers.map(x => ['Server', x.rank, x.server, '', '', '', x.crystals, '']), sn.players.map(p => ['Player', p.rank, p.server, p.name, searchOf(p.name, who.key(p.name, p.pid, '', day)), allyAt(p), p.score, p.masked ? 'yes' : '']));
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob(['\ufeff' + rows.map(r => r.map(q).join(',')).join('\n')], { type: 'text/csv' }));
      a.download = `frost-battle-${day}.csv`;
      a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
      return;
    }
    if (!read) return;
    const rows = [['Battlefield', 'Server', 'Rank', 'Name', 'Base CP']];
    const n = view === 'sum' ? TOP : LONG;
    read.fields.forEach((f, i) => f.forEach(s => top(s, n).forEach((p, j) => rows.push([i + 1, s, j + 1, p[0], p[1]]))));
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob(['﻿' + rows.map(r => r.map(q).join(',')).join('\n')], { type: 'text/csv' }));
    a.download = `frost-crystal-${day}-top${n}.csv`;
    a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  };
  load();
})();
</script>
</body>
</html>
