<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neutral City</title>
<link rel="icon" href="icon.png">
<!-- Neutral City (nc.html): the Frost season's Neutral City battles. All: every S2698 player's individual
     score on each battle date (the game's Points Log). Each date: that round's cities, who holds each, the
     servers' ranking there and how our declared battles went, then our players' points in each city we fought in. The bookmark's Read Neutral City reads them in
     the game and keeps them on the Worker (api/nc-read) for everyone. -->
<style>
:root{--bg:#eef4f9;--card:#fff;--ink:#14212e;--dim:#62748a;--line:#dbe5ee;--head:#f4f8fb;--acc:#1789a8;--us:#e8f6ea;--usink:#1f7a3a;--bad:#b42318;
  --band1:#0b3b57;--band2:#1789a8;--band3:#8fd6e6}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0d151d;--card:#15212c;--ink:#e6eef5;--dim:#8ea2b5;--line:#243444;--head:#1a2835;--acc:#5cc6d6;--us:#173322;--usink:#7fd99a;--bad:#ff8a80}}
:root[data-theme="dark"]{--bg:#0d151d;--card:#15212c;--ink:#e6eef5;--dim:#8ea2b5;--line:#243444;--head:#1a2835;--acc:#5cc6d6;--us:#173322;--usink:#7fd99a;--bad:#ff8a80}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
.band{background:linear-gradient(135deg,var(--band1),var(--band2) 60%,var(--band3));color:#fff;padding:22px 16px 18px}
.band .in,.wrap{max-width:1280px;margin:0 auto}
.band h1{margin:0;font-size:24px;letter-spacing:.01em}
.band p{margin:4px 0 0;opacity:.85}
.band a{color:#fff}
.homelink{display:inline-flex;align-items:center;gap:6px;margin:0 0 10px;padding:4px 12px 4px 10px;border-radius:999px;font-size:13px;font-weight:600;
  text-decoration:none;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.35)}
.homelink:hover{background:rgba(255,255,255,.26)}
.wrap{padding:16px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.bar .grow{flex:1}
/* on a phone: the tabs and Download CSV on one line, the status on its own line below */
@media (max-width:640px){.bar .status{order:3;flex-basis:100%}.bar #csv{margin-left:auto}}
button,.btn{font:inherit;font-weight:600;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:7px 12px;cursor:pointer}
button.pri{background:var(--acc);border-color:var(--acc);color:#fff}
button:disabled{opacity:.55;cursor:default}
.status{color:var(--dim)}
.status.bad{color:var(--bad)}
.days{display:flex;gap:4px;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;margin:0 0 14px;box-shadow:inset 0 -1px 0 var(--line)}
.days::-webkit-scrollbar{display:none}
.days button{flex:none;border:0;border-bottom:3px solid transparent;border-radius:0;padding:8px 14px;background:transparent;color:var(--dim);font-size:15px}
.days button.on{color:var(--ink);border-bottom-color:var(--acc)}
.days[hidden]{display:none}
:root{--won:#1f9d55;--wonbg:#e3f5ea;--lose:#d64545;--losebg:#fbe7e7;--oth:#6b7f94;--othbg:#eef2f6}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--won:#5fd38d;--wonbg:#16301f;--lose:#ff7a7a;--losebg:#3a1d22;--oth:#9fb1c4;--othbg:#1d2a37}}
:root[data-theme="dark"]{--won:#5fd38d;--wonbg:#16301f;--lose:#ff7a7a;--losebg:#3a1d22;--oth:#9fb1c4;--othbg:#1d2a37}
h2.sec{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--dim);margin:18px 2px 8px}
h2.sec:first-child{margin-top:0}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:820px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tile{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.tile .k{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--dim);font-weight:700}
.tile .v{font-size:24px;font-weight:800;margin-top:2px}
.tile .v small{font-size:14px;color:var(--dim)}
.tile .s{font-size:12.5px;color:var(--dim)}
.rapp{color-scheme:dark;color:#f3f3f7;background:rgba(22,22,30,.97);border-radius:18px;box-shadow:0 12px 40px rgba(0,0,0,.25),inset 0 0 0 2px rgba(224,69,123,.55);overflow:hidden}
.rhead{display:flex;align-items:center;gap:10px;padding:12px 14px 8px;flex-wrap:wrap}
.rhead b{font-size:15.5px}
.rsearch{flex:1;min-width:160px;display:flex;gap:8px;align-items:center;background:rgba(255,255,255,.08);border-radius:999px;padding:6px 14px;margin:0}
.rsearch:focus-within{box-shadow:inset 0 0 0 2px rgba(224,69,123,.85)}
.rsearch input{flex:1;min-width:0;border:0;outline:0;background:none;color:#fff;font:inherit;font-size:15px;padding:0;caret-color:#fff}
.rreads{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:0 14px 8px;font-size:12.5px;color:rgba(235,235,245,.65)}
.rbar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:0 14px 10px}
.rchip{border:0;background:rgba(255,255,255,.08);color:#f3f3f7;border-radius:999px;padding:5px 12px;font:inherit;font-size:12.5px;font-weight:400;cursor:pointer}
.rchip.on{background:rgba(195,20,65,.35);box-shadow:inset 0 0 0 1px #e0457b}
.rcount{margin-left:auto;font-size:12.5px;color:rgba(235,235,245,.5)}
.rbody{overflow:auto;padding:0 14px 14px}
.rtable{width:100%;border-collapse:collapse;font-size:13.5px}
.rtable th{position:sticky;top:0;background:#20212c;text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:rgba(235,235,245,.6);padding:8px 10px;font-weight:600;white-space:nowrap}
.rtable th.n,.rtable td.n{text-align:right;font-variant-numeric:tabular-nums}
.rtable td{padding:7px 10px;border-top:1px solid rgba(255,255,255,.08);white-space:nowrap;color:#f3f3f7}
.rtable tr.us td{background:rgba(126,226,168,.12);color:#8ff0b5;font-weight:700}
.rtable td.up{color:#8ff0b5;font-size:12.5px}
.rtable .rdim{color:rgba(235,235,245,.45)}
.tabs[hidden]{display:none}
.rclear{flex:none;width:22px;height:22px;display:grid;place-items:center;border:0;border-radius:50%;padding:0;background:rgba(255,255,255,.16);color:#fff;font-size:12px;line-height:1;cursor:pointer}
.rclear:hover{background:rgba(255,255,255,.28)}
.rclear[hidden]{display:none}
.empty{padding:14px 11px;color:var(--dim)}
.skel{height:200px;border-radius:10px;background:linear-gradient(90deg,var(--card),var(--head),var(--card));background-size:200% 100%;animation:sk 1.4s linear infinite;border:1px solid var(--line)}
@keyframes sk{to{background-position:-200% 0}}
.rtable td.n{color:#f3f3f7}
.rtable td.n.rdim{color:rgba(235,235,245,.45)}
/* a date: its round's cities by level, ours in green, the ones we declared on and lost in red */
.tiles{margin:0 0 18px}
.lv{margin:0 0 18px}
.cities{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.city{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.city.us{border-color:color-mix(in srgb,var(--won) 55%,transparent);background:var(--wonbg)}
.city.lost{border-color:color-mix(in srgb,var(--lose) 55%,transparent);background:var(--losebg)}
.city h3{margin:0 0 4px;font-size:15px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.tag{font-size:12px;font-weight:700;padding:1px 8px;border-radius:999px;color:#fff}
.tag.won{background:var(--won)}.tag.lost{background:var(--lose)}
.own{font-size:13px;color:var(--dim);margin-bottom:4px}.own b{color:var(--ink)}
.usline{font-size:13px;margin:0 0 6px;font-variant-numeric:tabular-nums}
.city ol{margin:0;padding-left:22px;font-size:13px}
.city ol li.me{font-weight:700;color:var(--usink)}
/* a city's two lists: its ranking, then every server that declared on it (ranked or not) */
.city h4{margin:8px 0 3px;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--dim);font-weight:700}
.decl{display:flex;flex-wrap:wrap;gap:4px}
.decl span{font-size:12px;padding:1px 7px;border-radius:6px;background:var(--head);border:1px solid var(--line);font-variant-numeric:tabular-nums}
.decl span.me{font-weight:700;color:var(--usink);border-color:color-mix(in srgb,var(--usink) 45%,transparent)}
.decl span.no{color:var(--dim)}
.rchip small{opacity:.6;margin-left:4px}
/* each alliance in its colour, as the other cards show it (index.html) */
.rtag{display:inline-block;border-radius:6px;padding:1px 7px;font-size:12px;font-weight:700;background:#3a3a3a;color:#ddd}
.rtag.tLeft{background:transparent;color:#8a8f99;box-shadow:inset 0 0 0 1px #4a4f58}.rtag.t698N{background:#22324f;color:#9ec5ff}.rtag.t698S{background:#3b2340;color:#e9a8ff}.rtag.t698W{background:#203d33;color:#7ee2a8}.rtag.t698C{background:#45321b;color:#ffc078}
/* the tables as the site's cards draw them (index.html, cards.js): the title row with its buttons, the reads
   line, the chips, the name kept in view when the columns scroll sideways, sortable headers */
.rapp{font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;min-height:560px}
.rsearch{padding-right:6px;transition:box-shadow .15s ease}
.rsearch input{border-radius:0;line-height:22px;width:auto}
.rgo{width:auto;flex:none;border:0;border-radius:999px;padding:7px 14px;font:inherit;font-weight:700;color:#fff;cursor:pointer;background:rgba(255,255,255,.12)}
.rgo:hover{background:rgba(255,255,255,.2)}
.rsheet{flex:none;display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:7px 13px;font-weight:700;font-size:13.5px;text-decoration:none;color:#fff;background:rgba(255,255,255,.12)}
.rsheet:hover{background:rgba(255,255,255,.2)}
.rsheet svg{width:15px;height:15px}
.rreads{gap:6px 14px}
.rchip{font-weight:400}
.rbody{flex:1}
.rtable th{cursor:pointer;border:0}
.rtable td{border-top:0;border-bottom:1px solid rgba(255,255,255,.08)}
.wbtable{border-collapse:separate;border-spacing:0;min-width:100%;width:auto}
.wbtable th.n{text-align:right}
.wbtable td{background:#1a1a23}
.wbtable th:first-child,.wbtable td:first-child{position:sticky;left:0;z-index:1}
.wbtable th:first-child{z-index:3}
.wbtable td:first-child{box-shadow:1px 0 0 rgba(255,255,255,.08)}
.wbtable tr.us td{background:#1d2a23}
.bar[hidden]{display:none}
@media (max-width:640px){.rapp{border-radius:14px}}
.rtag{display:inline-block;border-radius:6px;padding:1px 7px;font-size:12px;font-weight:700;background:#3a3a3a;color:#ddd}
.rtag.tLeft{background:transparent;color:#8a8f99;box-shadow:inset 0 0 0 1px #4a4f58}.rtag.t698N{background:#22324f;color:#9ec5ff}.rtag.t698S{background:#3b2340;color:#e9a8ff}.rtag.t698W{background:#203d33;color:#7ee2a8}.rtag.t698C{background:#45321b;color:#ffc078}
</style>
</head>
<body>
<div class="band"><div class="in">
  <a class="homelink" id="homeLink" href="./"><span aria-hidden="true">←</span>Home</a>
  <h1>Neutral City</h1>
</div></div>
<div class="wrap">
  <div class="days" id="days" role="tablist" hidden></div>
  <div class="bar" id="bar">
    <span class="status grow" id="status">Loading…</span>
    <button type="button" id="csv" disabled>Download CSV</button>
  </div>
  <div id="out"></div>
</div>
<script src="last.js?v=1"></script>
<script src="who.js?v=7"></script>
<script src="sendday.js?v=3"></script>
<script>
// inside the site (index.html#nc) the site's own header has the way back
if (window.frameElement) document.getElementById('homeLink').remove();
</script>
<script>
(function () {
  const API = location.hostname.endsWith('.workers.dev') ? '/api' : 'https://data-collection.jk06nm04.workers.dev/api';
  const US = 2698, ALL = 'all';
  const $ = id => document.getElementById(id);
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
  const N = v => Number(v || 0).toLocaleString();
  let days = {}, day = ALL, q = '';                // every battle date's read {players, cities, summary}; the tab shown; the search
  let bf = '';                                     // the battlefield shown under a date's cities
  // as the site's cards: each alliance as its coloured label; the chips Everyone, the site's alliances (as the admin
  // view sets them, kept by the site on this device) and Other; a header sorts by its column, again the other way
  const AL = (() => { try { const a = JSON.parse(localStorage.getItem('site.settings')).alliances; if (Array.isArray(a) && a.length) return a; } catch {} return ['698N', '698S', '698W', '698C']; })();
  let al = '';
  const allyTag = a => a ? `<span class="rtag t${esc(a)}">${esc(a)}</span>` : '<span class="rdim">—</span>';
  const inAl = ally => !al || (al === 'OTHER' ? !AL.includes(ally) : ally === al);
  const chips = () => ['', ...AL, 'OTHER'].map(a => `<button type="button" class="rchip${al === a ? ' on' : ''}" data-al="${esc(a)}">${a === 'OTHER' ? 'Other' : esc(a) || 'Everyone'}</button>`).join('');
  const sorts = {};                                // each table's sort, {k, asc}
  function sorted(id, rows, val, def) {
    const s = sorts[id] || (sorts[id] = { k: def, asc: false }), v = val[s.k] || val[def], dir = s.asc ? 1 : -1;
    return rows.slice().sort((a, b) => { const x = v(a), y = v(b); return (typeof x === 'string' ? x.localeCompare(y) : (x ?? -1) - (y ?? -1)) * dir; });
  }
  const th = (id, k, label, num) => { const s = sorts[id] || {}; return `<th class="${num ? 'n' : ''}" data-sort="${id}:${esc(k)}">${label}${s.k === k ? (s.asc ? ' ▲' : ' ▼') : ''}</th>`; };
  // a header's click: its column, highest first (names A to Z), then the other way
  function sortClick(e, redraw) {
    const h = e.target.closest('[data-sort]'); if (!h) return false;
    const [id, k] = h.dataset.sort.split(':'), s = sorts[id] || (sorts[id] = {});
    if (s.k === k) s.asc = !s.asc; else { s.k = k; s.asc = k === 'name' || k === 'ally'; }
    redraw(); return true;
  }
  const SHEET_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M4 9h16M4 15h16M10 3v18"/></svg>';
  const SHEET = 'https://docs.google.com/spreadsheets/d/1NeHELo_UY1KYNMSKzlHo0z0jlMUrtP1gEFZQXYW2h_U/edit#gid=0';
  // the sheet's link only in admin mode (the site's admin pill, kept in this browser): visitors have no access to it
  const isAdmin = () => { try { return !!localStorage.getItem('adminPass'); } catch { return false; } };
  // each player's search name, as the site's other cards have it (docs/cards.js, frost.html): from the roster
  // workbook's Alliance Rosters tab first, then the Base CP sends; the exact name first, then one written
  // without the fancy letters
  const fold = s => String(s || '').normalize('NFKC').toLowerCase().replace(/о/g, 'o').replace(/[^\p{L}\p{N}]/gu, '');
  let snames = [new Map(), new Map()];
  function nameMap(list) {
    const m = new Map(), weakKeys = new Set();
    for (const [name, , search, weak] of list || []) for (const k of [name, '~' + fold(name)]) {
      if (weak && m.has(k) && !weakKeys.has(k)) continue;
      m.set(k, search); weak ? weakKeys.add(k) : weakKeys.delete(k);
    }
    // a tagged name ("Killua.C") under the game's name too, where only one row is tagged that way and none has it plain
    const bare = new Map();
    for (const [name, , search] of list || []) { const b = Who.untag(name); if (b) bare.set(b, bare.has(b) && bare.get(b) !== search ? null : search); }
    for (const [b, s] of bare) if (s && !m.has(b)) { m.set(b, s); if (!m.has('~' + fold(b))) m.set('~' + fold(b), s); }
    return m;
  }
  const searchOf = (name, key) => { if (key) { const s = who.search(key); if (s !== undefined) return s; } for (const m of snames) { const s = m.get(name) || (fold(name) !== '' && m.get('~' + fold(name))); if (s) return s; } return ''; };
  const nameCell = (name, key) => { const s = searchOf(name, key); return esc(name) + (s && s !== name ? ` <span class="rdim">(${esc(s)})</span>` : ''); };
  const nameHit = (name, f, key) => !f || fold(name).includes(f) || fold(searchOf(name, key)).includes(f);

  // the last read (this browser's, last.js) at once, then the Worker's when it comes, drawn again only if it changed
  let who = Who(null);                             // who a read is, through name changes (who.js)
  function show(j, jn, jr) {
    if (jn) snames = [nameMap(jn.roster), nameMap(jn.raw)];
    if (jr) who = Who(jr, jn && jn.roster);
    days = (j && j.days) || {};
    if (day !== ALL && !days[day]) day = ALL;
    if (!Object.keys(days).length) {
      $('status').textContent = 'Nothing read yet.';
      $('out').innerHTML = '<div class="empty">Open the game and tap <b>Read Neutral City</b> in the 2698 Data Extractor bookmark after a battle: it reads the Points Log and the round\'s cities.</div>';
      return;
    }
    $('days').hidden = false; draw(); $('csv').disabled = false;
  }
  async function load() {
    const L = Last.post(API + '/nc-read'), Ln = Last.post(API + '/search-names'), Lr = Last.post(API + '/roster');
    if (L.now) show(L.now, Ln.now, Lr.now); else $('out').innerHTML = '<div class="skel"></div>';
    try {
      const [j, jn, jr] = await Promise.all([L.next, Ln.next.catch(() => null), Lr.next.catch(() => null)]);
      if (!L.now || !L.same || (jn && !Ln.same) || (jr && !Lr.same)) show(j, jn || Ln.now, jr || Lr.now);
    } catch (e) {
      if (L.now) return;                                           // the last read stays
      $('status').className = 'status grow bad'; $('status').textContent = '✗ ' + (e.message || e);
      $('out').innerHTML = '';
    }
  }

  const dates = () => Object.keys(days).sort();
  const dayName = d => new Date(d + 'T00:00:00Z').toLocaleDateString([], { day: 'numeric', month: 'short', timeZone: 'UTC' });
  // admin: a battle date sent to the Neutral City sheet and its Practice Round sheet (sendday.js)
  const sendDay = SendDay({ api: API, path: '/nc-send', what: 'Neutral City', original: 'neutral', label: d => dayName(d), after: $('days') });
  function draw() {
    sendDay.show(day === ALL ? null : day);
    $('days').innerHTML = [ALL, ...dates()].map(d =>
      `<button type="button" role="tab" data-day="${esc(d)}" class="${d === day ? 'on' : ''}" aria-selected="${d === day}">${d === ALL ? 'All' : esc(dayName(d))}</button>`).join('');
    $('bar').hidden = day === ALL;                 // All: its Export CSV is in the card, as on the other cards
    day === ALL ? drawAll() : drawDay();
  }

  // All: every player of the Points Logs, ranked by their scores on every date together, one column per date.
  // A player who changed names is one row, under their name now (the roster's, else the latest battle's)
  function allRows() {
    const ds = dates().filter(d => (days[d].players || []).length), by = new Map();
    for (const d of ds) for (const [name, score, ally, pid] of days[d].players) {
      if (!name) continue;
      const k = who.key(name, pid, ally), ro = who.row(k);
      const r = by.get(k) || { key: k, name: ro ? ro.name : name, ally: '', on: {}, sum: 0, was: new Set() };
      if (!ro) r.name = name;
      r.was.add(name);
      r.on[d] = (r.on[d] || 0) + score; r.sum += score; r.ally = ally || r.ally; by.set(k, r);    // the latest battle's alliance
    }
    return { ds, rows: [...by.values()].sort((a, b) => b.sum - a.sum).map((r, i) => ({ ...r, rank: i + 1 })) };
  }
  function drawAll() {
    const { ds, rows } = allRows(), f = fold(q);
    const val = { name: r => r.name, ally: r => r.ally, sum: r => r.sum, ...Object.fromEntries(ds.map(d => [d, r => r.on[d]])) };
    const l = sorted('all', rows.filter(r => inAl(r.ally) && (nameHit(r.name, f, r.key) || [...r.was].some(n => fold(n).includes(f)))), val, 'sum');
    const head = th('all', 'name', 'Name') + th('all', 'ally', 'Alliance') + ds.map(d => th('all', d, esc(dayName(d)), 1)).join('');
    const was = r => [...r.was].filter(n => n !== r.name);
    const body = l.map(r => `<tr><td>${nameCell(r.name, r.key)}${was(r).length ? ` <span class="rdim" title="Read before as">was ${was(r).map(esc).join(', ')}</span>` : ''}</td><td>${allyTag(r.ally)}</td>${ds.map(d => r.on[d] != null
      ? `<td class="n">${N(r.on[d])}</td>` : '<td class="n rdim">—</td>').join('')}</tr>`).join('');
    $('out').innerHTML = `<div class="rapp"><div class="rhead"><b>Neutral City</b>
        <label class="rsearch"><span aria-hidden="true">🔍</span><input id="q" type="text" placeholder="Search a name" autocomplete="off" value="${esc(q)}"><button type="button" class="rclear" id="qx" title="Clear the search" aria-label="Clear the search"${q ? '' : ' hidden'}>✕</button></label>
        <button type="button" class="rgo" data-csv>Export CSV</button>${isAdmin() ? `<a class="rsheet" href="${SHEET}" target="_blank" rel="noopener" title="Open in Google Sheets">${SHEET_ICON}Sheet ↗</a>` : ''}</div>
      <div class="rreads">${N(rows.length)} players · ${ds.length} ${ds.length === 1 ? 'battle' : 'battles'}${ds.length ? ' · last read ' + esc(dayName(ds[ds.length - 1])) : ''}</div>
      <div class="rbar">${chips()}<span class="rcount">${N(l.length)} of ${N(rows.length)} players</span></div>
      <div class="rbody"><table class="rtable wbtable"><thead><tr>${head}</tr></thead><tbody>${body || `<tr><td colspan="${ds.length + 2}" class="rdim">No player matches.</td></tr>`}</tbody></table></div></div>`;
    const inp = $('q');
    inp.oninput = () => { q = inp.value; const at = inp.selectionStart; drawAll(); const k = $('q'); k.focus(); k.setSelectionRange(at, at); };
    $('qx').onclick = e => { e.preventDefault(); q = ''; drawAll(); $('q').focus(); };
  }

  // a date: its round's numbers, then every city by level
  function drawDay() {
    const D = days[day], S = D.summary, pl = D.players || [];
    if (!S) {
      $('status').textContent = '';
      $('out').innerHTML = `<div class="empty">No cities read for this battle: only its Points Log (${N(pl.length)} players, on the All tab). The bookmark reads the cities after the battle, until the next round's.</div><div id="bf"></div>`;
      return drawField();
    }
    $('status').textContent = `Round ${S.round}`;
    const res = Object.fromEntries(S.declared.map(x => [x.n, x.won])), won = S.declared.filter(x => x.won).length;
    const tile = (v, k) => `<div class="tile"><div class="k">${k}</div><div class="v">${v}</div></div>`;
    let h = '<div class="tiles">' + tile(S.cities.filter(c => c.own === US).length, `Cities S${US} holds`) +
      tile(`${won} <small>/ ${S.declared.length}</small>`, 'Battles won') + tile(N(pl.length), 'Players who scored') + tile(N(S.score), 'Season score') + '</div>';
    const LV = { 1: 'Lv. 1 cities', 2: 'Lv. 2 cities', 3: 'Lv. 3 cities', 4: 'Frost\'s Heart' };
    for (const lv of [1, 2, 3, 4]) {
      const cs = S.cities.filter(c => Math.floor(c.n / 1000) === lv).sort((a, b) => a.n - b.n);
      if (!cs.length) continue;
      h += `<section class="lv"><h2 class="sec">${LV[lv]}</h2><div class="cities">` + cs.map(c => {
        const r = res[c.n];
        return `<div class="city${c.own === US ? ' us' : r === false ? ' lost' : ''}"><h3>City ${c.n}${r === true ? '<span class="tag won">Won</span>' : r === false ? '<span class="tag lost">Lost</span>' : ''}</h3>
          <div class="own">Held by <b>${c.own ? 'S' + c.own : 'nobody'}</b></div>
          ${c.us ? `<div class="usline">S${US}: #${c.us.rank} · ${N(c.us.score)} pts · ${c.us.st} stations, ${c.us.hub} hubs</div>` : ''}
          ${c.rk.length || c.fight.length ? `<h4>Ranked servers</h4>${c.rk.length ? '<ol>' + c.rk.map(s => `<li${s === US ? ' class="me"' : ''}>S${s}</li>`).join('') + '</ol>' : '<div class="own">None</div>'}
            <h4>Servers that declared on this city (${c.fight.length})</h4><div class="decl">${c.fight.slice().sort((a, b) => a - b).map(s =>
              `<span class="${s === US ? 'me' : c.rk.includes(s) ? '' : 'no'}" title="${c.rk.includes(s) ? 'Ranked' : 'Not ranked'}">S${s}</span>`).join('')}</div>` : '<div class="own">No battle this round</div>'}</div>`;
      }).join('') + '</div></section>';
    }
    $('out').innerHTML = h + '<div id="bf"></div>';
    drawField();
  }

  // the date's battlefields: our players' points in each city we fought in, one city at a time
  function drawField() {
    const fields = (days[day] || {}).cities || {}, ns = Object.keys(fields).sort((a, b) => a - b);
    if (!ns.length || !$('bf')) return;
    if (!fields[bf]) bf = ns[0];
    const f = fold(q), all = fields[bf], sum = all.reduce((a, p) => a + p[1], 0);
    const l = sorted('bf', all.map(p => ({ name: p[0], score: p[1], ally: p[2] || '' })).filter(r => inAl(r.ally) && nameHit(r.name, f)),
      { name: r => r.name, ally: r => r.ally, score: r => r.score }, 'score');
    $('bf').innerHTML = `<div class="rapp"><div class="rhead"><b>Points by battlefield</b>
        <label class="rsearch"><span aria-hidden="true">🔍</span><input id="q" type="text" placeholder="Search a name" autocomplete="off" value="${esc(q)}"><button type="button" class="rclear" id="qx" title="Clear the search" aria-label="Clear the search"${q ? '' : ' hidden'}>✕</button></label>
        <button type="button" class="rgo" data-csv>Export CSV</button></div>
      <div class="rreads">City ${esc(bf)} · ${N(all.length)} players · ${N(sum)} points</div>
      <div class="rbar">${ns.map(n => `<button type="button" class="rchip${n === bf ? ' on' : ''}" data-bf="${n}">City ${n}<small>${N(fields[n].length)}</small></button>`).join('')}</div>
      <div class="rbar">${chips()}<span class="rcount">${N(l.length)} of ${N(all.length)} players</span></div>
      <div class="rbody"><table class="rtable wbtable"><thead><tr>${th('bf', 'name', 'Name')}${th('bf', 'ally', 'Alliance')}${th('bf', 'score', 'Points', 1)}</tr></thead><tbody>
      ${l.map(r => `<tr><td>${nameCell(r.name)}</td><td>${allyTag(r.ally)}</td><td class="n">${N(r.score)}</td></tr>`).join('') || '<tr><td colspan="3" class="rdim">No player matches.</td></tr>'}
      </tbody></table></div></div>`;
    const inp = $('q');
    inp.oninput = () => { q = inp.value; const at = inp.selectionStart; drawField(); const k = $('q'); k.focus(); k.setSelectionRange(at, at); };
    $('qx').onclick = e => { e.preventDefault(); q = ''; drawField(); $('q').focus(); };
  }
  // a city's chip: that city's list
  $('out').addEventListener('click', e => {
    if (e.target.closest('[data-csv]')) return $('csv').click();
    if (sortClick(e, () => day === ALL ? drawAll() : drawField())) return;
    const c = e.target.closest('[data-al]');
    if (c) { al = c.dataset.al; return day === ALL ? drawAll() : drawField(); }
    const b = e.target.closest('[data-bf]'); if (!b) return;
    bf = b.dataset.bf; drawField();
  });

  $('days').onclick = e => { const b = e.target.closest('[data-day]'); if (b && (b.dataset.day === ALL || days[b.dataset.day])) { day = b.dataset.day; q = ''; bf = ''; draw(); } };

  $('csv').onclick = () => {
    const cell = v => /[",\n]/.test(v) ? '"' + String(v).replace(/"/g, '""') + '"' : v;
    let rows, file;
    if (day === ALL) {
      const { ds, rows: l } = allRows();
      rows = [['Rank', 'Name', 'Search name', 'Alliance', ...ds]].concat(l.map(r => [r.rank, r.name, searchOf(r.name, r.key), r.ally, ...ds.map(d => r.on[d] != null ? r.on[d] : '')]));
      file = `neutral-city-s${US}-all.csv`;
    } else {
      const S = days[day].summary, fields = days[day].cities || {};
      if (!S && !Object.keys(fields).length) return;
      const res = S ? Object.fromEntries(S.declared.map(x => [x.n, x.won ? 'won' : 'lost'])) : {};
      rows = S ? [['City', 'Held by', 'Our result', 'Our rank', 'Our points', 'Stations', 'Hubs', 'Ranking', 'Servers fought']]
        .concat(S.cities.slice().sort((a, b) => a.n - b.n).map(c => [c.n, c.own || '', res[c.n] || '', c.us ? c.us.rank : '', c.us ? c.us.score : '',
          c.us ? c.us.st : '', c.us ? c.us.hub : '', c.rk.join(' '), c.fight.join(' ')])) : [];
      // then each battlefield's players, below the cities
      if (Object.keys(fields).length) rows = rows.concat(S ? [[]] : [], [['City', 'Rank', 'Name', 'Search name', 'Alliance', 'Points']],
        ...Object.keys(fields).sort((a, b) => a - b).map(n => fields[n].map((p, i) => [n, i + 1, p[0], searchOf(p[0]), p[2] || '', p[1]])));
      file = `neutral-city-${day}.csv`;
    }
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob(['﻿' + rows.map(r => r.map(cell).join(',')).join('\n')], { type: 'text/csv' }));
    a.download = file; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  };
  load();
})();
</script>
</body>
</html>
