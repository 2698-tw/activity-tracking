<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kartz ranking</title>
<link rel="icon" type="image/png" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<link rel="stylesheet" href="fonts.css?v=1">
<style>
@font-face{font-family:Satisfy;font-style:normal;font-weight:400;font-display:swap;src:url(fonts/satisfy.woff2) format('woff2')}
@font-face{font-family:Orbitron;font-style:normal;font-weight:600;font-display:swap;src:url(fonts/orbitron-600.woff2) format('woff2')}
</style>
<script>
try { const t = JSON.parse(localStorage.getItem('kartz.theme'));
      if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch {}
</script>
<style>
:root{
  --bg:#f4f5f8; --panel:#fff; --ink:#15181f; --muted:#666e7d; --line:#dfe3ea;
  --accent:#3b5bdb; --ok:#2b8a3e; --warn:#c26a00; --bad:#c92a2a;
  --okbg:#e9f7ed; --warnbg:#fff4e2; --badbg:#fdecec;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12141a; --panel:#1a1d25; --ink:#e8eaef; --muted:#98a0b0; --line:#2b303c;
  --accent:#748ffc; --ok:#69db7c; --warn:#ffc078; --bad:#ff8787;
  --okbg:#17301e; --warnbg:#33270f; --badbg:#361a1a;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#12141a; --panel:#1a1d25; --ink:#e8eaef; --muted:#98a0b0; --line:#2b303c;
  --accent:#748ffc; --ok:#69db7c; --warn:#ffc078; --bad:#ff8787;
  --okbg:#17301e; --warnbg:#33270f; --badbg:#361a1a;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font:15px/1.5 Selawik,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  padding:16px;padding-bottom:64px}
.wrap{max-width:960px;margin:0 auto}
h1{font-size:19px;margin:0 0 2px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:6px}
.top h1{margin:0}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand img{width:36px;height:36px;border-radius:9px;flex:none}
.brand h1{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
button.themebtn{width:auto;flex:none;padding:7px;line-height:0;background:transparent;color:var(--ink);
  border:1px solid var(--line);border-radius:999px}
.themebtn svg{width:18px;height:18px}
.jump{position:fixed;z-index:40;left:max(12px, env(safe-area-inset-left));
  bottom:max(12px, env(safe-area-inset-bottom));display:flex;gap:6px;
  opacity:0;transform:translateY(8px);pointer-events:none;transition:opacity .2s ease, transform .2s ease}
.jump.on{opacity:1;transform:none;pointer-events:auto}
.jump button{width:auto;padding:6px 12px;font-size:12px;font-weight:500;border-radius:999px;
  background:var(--panel);color:var(--ink);border:1px solid var(--line);box-shadow:0 2px 10px rgba(0,0,0,.18)}
.jump button[hidden]{display:none}
.sub{color:var(--muted);font-size:13px;margin:0 0 18px}
section{background:var(--panel);border:1px solid var(--line);border-radius:12px;
  padding:14px 16px;margin-bottom:12px}
h2{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);
  margin:0 0 10px;font-weight:600}
label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
input,select,textarea,button{font:inherit;color:var(--ink);background:var(--panel);
  border:1px solid var(--line);border-radius:8px;padding:9px 11px;width:100%}
textarea{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;resize:vertical}
button{background:var(--accent);color:#fff;border:0;font-weight:600;cursor:pointer}
button:disabled{opacity:.45;cursor:default}
button{transition:transform .06s ease, filter .12s ease, background .12s ease}
button:not(:disabled):active{transform:translateY(1px)}
button:not(.ghost):not(:disabled):active{filter:brightness(.88)}
button.ghost:not(:disabled):active{background:var(--line)}
button.done, button.ghost.done{background:var(--ok);border-color:var(--ok);color:#fff;
  filter:none;transform:none}
button.ghost{background:transparent;color:var(--accent);border:1px solid var(--line);font-weight:500}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{flex:1;min-width:150px}
.drop{border:2px dashed var(--line);border-radius:12px;padding:26px 16px;text-align:center;
  color:var(--muted);cursor:pointer}
.drop.on{border-color:var(--accent);color:var(--accent)}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:10px}
.bar>i{display:block;height:100%;width:0;background:var(--accent);transition:width .15s}
.log{font-family:ui-monospace,Menlo,monospace;font-size:12px;color:var(--muted);
  white-space:pre-wrap;margin-top:8px}
.strip{display:flex;gap:5px;overflow-x:auto;margin-top:10px;padding-bottom:4px}
.strip img{height:88px;border-radius:5px;border:1px solid var(--line);flex:none}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px;min-width:600px}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.05em;
  color:var(--muted);padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:5px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
#tbl tr.ok td:nth-child(3),#tbl tr.ok td:nth-child(4),#cpTbl tr.ok td:nth-child(3){color:var(--ok)}
tr.new{background:var(--warnbg)}
.pill{font-size:11px;padding:2px 7px;border-radius:20px;font-weight:600;white-space:nowrap}
.p-ok{background:var(--okbg);color:var(--ok)}
.p-new{background:var(--warnbg);color:var(--warn)}
.p-bad{background:var(--badbg);color:var(--bad)}
.pickbox{padding:5px 8px;font-size:13px;min-width:170px}
.named{color:var(--ok)}
.asdrawn{color:var(--ink)}
.nmtext{display:inline-block;width:12em;vertical-align:middle;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
button.pencil{display:inline-flex;align-items:center;gap:4px;width:auto;margin-left:12px;padding:3px 10px;vertical-align:middle;
  border:0;border-radius:999px;font-size:12px;font-weight:600;line-height:1.4;cursor:pointer;
  background:color-mix(in srgb, var(--accent) 12%, transparent);color:var(--accent)}
button.pencil:hover{background:color-mix(in srgb, var(--accent) 20%, transparent)}
button.pencil:not(:disabled):active{filter:none}
.field{position:relative;display:inline-block;vertical-align:middle}
.field .pickbox{padding-right:78px}
button.keepbtn{position:absolute;top:50%;right:4px;transform:translateY(-50%);width:auto;margin:0;padding:3px 10px;
  border:0;border-radius:999px;font-size:12px;font-weight:600;line-height:1.4;cursor:pointer;
  background:color-mix(in srgb, var(--accent) 12%, transparent);color:var(--accent)}
button.keepbtn:hover{background:color-mix(in srgb, var(--accent) 20%, transparent)}
button.keepbtn:not(:disabled):active{filter:none;transform:translateY(-50%)}
button.ghost.tickok{color:var(--ok)}
.allipick{width:auto;min-width:88px;max-width:150px;padding:7px 9px}
#tbl tr.drop,#cpTbl tr.drop{opacity:.4}
.menu{position:fixed;z-index:50;background:var(--panel);border:1px solid var(--line);
  border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.16);max-height:210px;overflow-y:auto;
  min-width:200px;padding:4px 0}
.menu div{padding:6px 11px;font-size:13px;cursor:pointer;display:flex;
  justify-content:space-between;gap:12px;white-space:nowrap}
.menu div:hover,.menu div.on{background:var(--accent);color:#fff}
.menu div span{opacity:.55;font-size:11px}
.menu .none{color:var(--muted);cursor:default}
.menu .newopt{font-weight:600}
.menu hr{border:0;border-top:1px solid var(--line);margin:4px 0}
td select{padding:4px 6px;font-size:12px;min-width:150px}
.note{font-size:12px;color:var(--muted);margin-top:8px}
.warnbox{background:var(--warnbg);color:var(--warn);border-radius:8px;padding:9px 12px;
  font-size:13px;margin-top:10px}
.okbox{background:var(--okbg);color:var(--ok);border-radius:8px;padding:9px 12px;
  font-size:13px;margin-top:10px}
details summary{cursor:pointer;font-size:13px;color:var(--muted)}
.hide{display:none}
.sheetlink{display:block;text-align:center;font-size:13px;color:var(--accent);margin-top:6px}
.sheetlink.hide{display:none}
.homelink{display:inline-flex;align-items:center;gap:6px;margin:0 0 12px;padding:5px 14px 5px 11px;border-radius:999px;
  background:linear-gradient(135deg,#7b1a31,#c31441 60%,#e0457b);color:#fff;text-decoration:none;font-weight:600;font-size:14px;
  box-shadow:0 2px 8px rgba(195,20,65,.25);transition:filter .12s ease, transform .06s ease}
.homelink:hover{filter:brightness(1.08)}
.homelink:active{transform:translateY(1px)}
.edited{margin-left:6px}
.source{margin:12px 0 0;font-size:13px;color:var(--muted)}
.source a{color:var(--accent);text-decoration:none}
.nass{font-family:Orbitron,sans-serif;font-weight:600;letter-spacing:.06em;color:var(--ink)}

#home{margin:-16px -16px 0}
.athome #home{display:block}
.athome #app{display:none}
html[data-view] #tab-kartz{display:none}
html[data-view=cp] #tab-cp,html[data-view=roster] #tab-roster,html[data-view=whitebeard] #tab-wb,html[data-view=snowtrain] #tab-st,
html[data-view=energytower] #tab-et,html[data-view=mammoth] #tab-ma,html[data-view=frost] #tab-frost,html[data-view=nc] #tab-nc,html[data-view=player] #tab-player,html[data-view=practice] #tab-practice,html[data-view=stormduel] #tab-sd,html[data-view=admin] #tab-admin{display:block}
html[data-view=frost] #app,body:has(#tab-frost:not(.hide)) #app,html[data-view=nc] #app,body:has(#tab-nc:not(.hide)) #app,html[data-view=stormduel] #app,body:has(#tab-sd:not(.hide)) #app{max-width:1320px}
.frostframe{display:block;width:100%;height:80vh;border:0;border-radius:12px;background:var(--panel);opacity:0;transition:opacity .2s ease}
.frostframe.in{opacity:1}
.framebox{position:relative;min-height:60vh}
.framebox::before{content:"";position:absolute;inset:0 0 auto 0;height:min(60vh,520px);border-radius:12px;pointer-events:none;
  background:repeating-linear-gradient(180deg,var(--line) 0 34px,transparent 34px 44px);opacity:.55;animation:fbx 1.2s ease-in-out infinite alternate}
.framebox:has(.frostframe.in){min-height:0}
.framebox:has(.frostframe.in)::before{display:none}
@keyframes fbx{to{opacity:.25}}
.viewin{animation:viewIn .18s ease-out}
@keyframes viewIn{from{opacity:0;transform:translateY(4px)}}
.rskel{display:grid;gap:6px;padding:10px 0}
.rskel i{display:block;height:36px;border-radius:8px;background:linear-gradient(90deg,rgba(255,255,255,.04),rgba(255,255,255,.09),rgba(255,255,255,.04));background-size:200% 100%;animation:rsk 1.4s linear infinite}
@keyframes rsk{to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){.viewin,.rskel i,.framebox::before{animation:none}.frostframe{transition:none}}
.homeband{position:relative;overflow:hidden;height:140px;display:flex;align-items:center;
  background:linear-gradient(180deg,#3a1d2c,#6e2c3a 55%,#b9524a)}
.homeband .themebtn{position:absolute;top:14px;right:max(16px, env(safe-area-inset-right));z-index:2;color:#fff;border-color:rgba(255,255,255,.35)}
.bandinner{position:relative;width:100%;max-width:960px;margin:0 auto;padding:0 16px}
.bandtitle{display:inline-block;margin:0;padding-right:.15em;font:400 42px/1.2 Satisfy,cursive;color:#fff;text-shadow:0 0 14px rgba(255,92,154,.45)}
.bandtitle{clip-path:inset(0 100% 0 0)}
.writing .bandtitle{animation:writeIn 1.5s cubic-bezier(.45,.05,.35,1) .15s both}
.writing .bandinner::after{content:"";position:absolute;top:50%;left:16px;width:10px;height:10px;margin-top:-5px;border-radius:50%;background:#fff;
  box-shadow:0 0 10px #fff,0 0 22px #ff5c9a;opacity:0;animation:nib 1.5s cubic-bezier(.45,.05,.35,1) .15s both}
@keyframes writeIn{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
@keyframes nib{0%{opacity:0;transform:translateX(0)}8%{opacity:1}92%{opacity:1}100%{opacity:0;transform:translateX(var(--w,340px))}}
.cardsin .hcard{animation:cardIn .4s cubic-bezier(.2,.8,.2,1) both}
.cardsin .hcard:nth-child(2){animation-delay:.04s}.cardsin .hcard:nth-child(3){animation-delay:.08s}.cardsin .hcard:nth-child(4){animation-delay:.12s}.cardsin .hcard:nth-child(5){animation-delay:.16s}.cardsin .hcard:nth-child(6){animation-delay:.2s}.cardsin .hcard:nth-child(7){animation-delay:.24s}.cardsin .hcard:nth-child(8){animation-delay:.28s}
@keyframes cardIn{from{opacity:0;transform:translateY(14px) scale(.98)}}
@media (prefers-reduced-motion:reduce){.writing .bandtitle{clip-path:none}.writing .bandtitle,.writing .bandinner::after,.cardsin .hcard{animation:none}}
@media (max-width:640px){.homeband{height:120px;align-items:flex-end;padding-bottom:12px}.bandtitle{font-size:34px}}
.homebody{margin:0 auto;padding:18px 16px 64px;max-width:1120px}
.homegrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:20px;align-items:start}
.homegrid .events{order:0}.homegrid .homecards{order:1}
@media (max-width:760px){.homegrid{grid-template-columns:1fr}.homegrid .events{order:2}}
.evonly .homecards,.evonly .homeband .apill,.evonly .ev .go2{display:none}
.evonly .homegrid{grid-template-columns:minmax(0,1fr);max-width:720px;margin:0 auto}
.homecards{display:flex;flex-direction:column;gap:10px}
.hcard{position:relative;overflow:hidden;border-radius:14px;padding:14px 16px;color:#fff;min-height:58px;
  display:flex;align-items:center;gap:14px;background:linear-gradient(135deg,#7b1a31,#c31441 60%,#e0457b)}
.hcard.cp{background:linear-gradient(135deg,#c31441,#f26b3a 55%,#f5b04c)}
.hcard::after{content:"";position:absolute;right:-40px;top:-40px;width:140px;height:140px;border-radius:50%;
  background:rgba(255,255,255,.12);pointer-events:none}
.hcard b{position:relative;font-size:19px;min-width:0}
@media (max-width:640px){.hcard b{font-size:18px}}
.hcard .go{position:relative;margin-left:auto;min-width:96px;text-align:center;border-radius:8px;padding:7px 14px;font-weight:700;text-decoration:none;white-space:nowrap;
  background:#fff;color:#7b1a31;transition:transform .06s ease, filter .12s ease}
.hcard .go:active{transform:translateY(1px);filter:brightness(.9)}
.hcard.cp .go{color:#c2410c}
.hcard.wb{background:linear-gradient(135deg,#1d2b64,#3a3f9e 55%,#7a5cd6)}
.hcard.wb .go{color:#2b2f86}
.hcard.st{background:linear-gradient(135deg,#0b4f6c,#1789a8 55%,#5cc6d6)}
.hcard.st .go{color:#0b4f6c}
.hcard.et{background:linear-gradient(135deg,#1f5130,#2f8a4c 55%,#8fd14f)}
.hcard.et .go{color:#1f5130}
.hcard.ma{background:linear-gradient(135deg,#4a2c17,#8a5a2b 55%,#d1a05a)}
.hcard.ma .go{color:#4a2c17}
.hcard.frost{background:linear-gradient(135deg,#1c2541,#3a5a8c 55%,#9cc3e6)}
.hcard.frost .go{color:#1c2541}
.hcard.nc{background:linear-gradient(135deg,#3b2a1a,#9a5b1e 55%,#f0b45e)}
.hcard.nc .go{color:#3b2a1a}
.hcard.player{background:linear-gradient(135deg,#3a1630,#a3285e 55%,#ef8fb4)}
.hcard.player .go{color:#3a1630}
.hcard.sd{background:linear-gradient(135deg,#2a1052,#6a32c0 55%,#b48cf0)}
.hcard.sd .go{color:#3b1a7a}
.events{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 14px 10px}
.events h2{display:flex;align-items:baseline;gap:8px;margin:0 0 10px}
.events h2 .r{margin-left:auto;text-transform:none;letter-spacing:0;font-weight:500}
.evday{font-size:12px;font-weight:700;color:var(--muted);margin:12px 0 6px;display:flex;gap:6px}
.evday:first-of-type{margin-top:0}
.evday.today{color:var(--ink)}
.ev{display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:9px;text-decoration:none;color:var(--ink)}
a.ev:hover{background:var(--line)}
.ev i{flex:none;width:4px;align-self:stretch;border-radius:2px;background:var(--c)}
.ev .n{flex:1;min-width:0;font-weight:600;font-size:14px}
.ev .n small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.ev .s{flex:none;font-size:12px;color:var(--muted);text-align:right;white-space:nowrap}
.ev.live .s{color:#16a34a;font-weight:700}
.ev.live .s::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:#22c55e;margin-right:5px;vertical-align:1px;box-shadow:0 0 0 3px rgba(34,197,94,.2)}
.ev.done{opacity:.45}
.ev.tog{cursor:pointer}
.ev.tog:hover{background:var(--line)}
.ev .go2{color:var(--muted);text-decoration:none;font-weight:700;padding:0 4px;border-radius:5px}
.ev .go2:hover{color:var(--ink);background:var(--line)}
.stages{list-style:none;margin:0 0 6px 13px;padding:2px 0 2px 14px;border-left:2px solid color-mix(in srgb,var(--c) 35%,transparent)}
.stages li{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;padding:3px 8px 3px 0;color:var(--muted);position:relative}
.stages li::before{content:"";position:absolute;left:-19px;top:9px;width:8px;height:8px;border-radius:50%;background:var(--panel);border:2px solid color-mix(in srgb,var(--c) 45%,transparent)}
.stages li b{font-weight:600;color:var(--ink)}
.stages li.done{opacity:.5}.stages li.done::before{background:color-mix(in srgb,var(--c) 45%,transparent)}
.stages li.now b{color:var(--c)}.stages li.now::before{background:var(--c);border-color:var(--c);box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 25%,transparent)}
.stages li span{white-space:nowrap}
.evmore{display:block;width:100%;margin-top:6px;background:transparent;border:0;color:var(--muted);font-size:13px;padding:6px}
.evnote{font-size:11px;color:var(--muted);margin:8px 0 0}
.rapp{color-scheme:dark;font:14px/1.45 Selawik,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:#f3f3f7;background:rgba(22,22,30,.97);border-radius:18px;
  box-shadow:0 12px 40px rgba(0,0,0,.25),inset 0 0 0 2px rgba(224,69,123,.55);overflow:hidden;display:flex;flex-direction:column;min-height:560px}
.rhead{display:flex;align-items:center;gap:10px;padding:12px 14px 8px;flex-wrap:wrap}
.rhead b{font-size:15.5px}
.rsearch{flex:1;min-width:160px;display:flex;gap:8px;align-items:center;background:rgba(255,255,255,.08);border-radius:999px;padding:6px 14px;margin:0}
.rsearch{padding-right:6px}
.rsearch{transition:box-shadow .15s ease}
.rsearch:focus-within{box-shadow:inset 0 0 0 2px rgba(224,69,123,.85)}
.rsearch input{flex:1;min-width:0;border:0;border-radius:0;outline:0;background:none;color:#fff;font:inherit;font-size:15px;line-height:22px;padding:0;width:auto;caret-color:#fff}
.rclear{flex:none;width:22px;height:22px;display:grid;place-items:center;border:0;border-radius:50%;padding:0;background:rgba(255,255,255,.16);color:#fff;font-size:12px;line-height:1;cursor:pointer}
.rclear:hover{background:rgba(255,255,255,.28)}
.rclear[hidden]{display:none}
.rgo{width:auto;flex:none;border:0;border-radius:999px;padding:7px 14px;font:inherit;font-weight:700;color:#fff;cursor:pointer;background:rgba(255,255,255,.12)}
.rsheet{flex:none;display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:7px 13px;font-weight:700;font-size:13.5px;text-decoration:none;color:#fff;
  background:rgba(255,255,255,.12)}
.rsheet:hover{background:rgba(255,255,255,.2)}
.rsheet[hidden]{display:none}
html:not(.isadmin) .rsheet{display:none!important}
.rsheet svg{width:15px;height:15px}
.viewtools{display:flex;justify-content:flex-end;margin:0 0 10px}
.viewtools .rsheet{color:var(--ink);background:var(--panel);border:1px solid var(--line)}
.viewtools .rsheet:hover{background:var(--line)}
.rreads{display:flex;gap:6px 14px;flex-wrap:wrap;padding:0 14px 8px;font-size:12.5px;color:rgba(235,235,245,.65)}
.upd{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px 3px 8px;font-size:12px;font-weight:600;white-space:nowrap;
  background:rgba(126,226,168,.12);color:#7ee2a8;box-shadow:inset 0 0 0 1px rgba(126,226,168,.28)}
.upd::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}

  const id = (link.match(/\/spreadsheets\/d\/([a-zA-Z0-9-_]+)/) || [])[1];
  if (!id) throw new Error('That does not look like a Google Sheets link.');
  const gid = (link.match(/[#&?]gid=(\d+)/) || [])[1] || '0';
  return `https://docs.google.com/spreadsheets/d/${id}/export?format=csv&gid=${gid}`;
}
function parseCsv(text) {
  const rows = [[]]; let cell = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) {
      if (c === '"' && text[i+1] === '"') { cell += '"'; i++; }
      else if (c === '"') q = false;
      else cell += c;
    } else if (c === '"') q = true;
    else if (c === ',') { rows[rows.length-1].push(cell); cell = ''; }
    else if (c === '\n') { rows[rows.length-1].push(cell); cell = ''; rows.push([]); }
    else if (c !== '\r') cell += c;
  }
  rows[rows.length-1].push(cell);
  return rows.filter(r => r.some(x => x.trim()));
}

function symKey(s) {
  const out = [];
  for (const ch of String(s || '')) {

  const tc = motionMap.cx || (motionMap.cx = tmp.getContext('2d', { willReadFrequently: true }));

  const d = tc.getImageData(0, 0, GW, GH).data;
  const g = new Float32Array(GW * GH);
  for (let i = 0; i < g.length; i++)

function movingRegion(accum) {
  let max = 0;

  let x0 = GW, x1 = -1, y0 = GH, y1 = -1, hits = 0;
  for (let y = 0; y < GH; y++) for (let x = 0; x < GW; x++) {
    if (accum[y*GW + x] < thresh) continue;
    hits++;
    if (x < x0) x0 = x; if (x > x1) x1 = x;
    if (y < y0) y0 = y; if (y > y1) y1 = y;
  }
  if (hits < GW * GH * 0.02 || x1 < 0) return null;
  const col = new Float32Array(GW);
  for (let x = 0; x < GW; x++) for (let y = y0; y <= y1; y++) col[x] += accum[y*GW + x];
  let colMax = 0;
  for (const v of col) if (v > colMax) colMax = v;
  const moving = x => col[x] >= colMax * 0.05;
  for (x0 = 0; x0 < GW - 1 && !moving(x0); x0++);
  for (x1 = GW - 1; x1 > x0 && !moving(x1); x1--);
  const pad = 0.006;
  const box = { x0: Math.max(0, x0/GW - pad), x1: Math.min(1, (x1+1)/GW + pad),
                y0: Math.max(0, y0/GH - pad), y1: Math.min(1, (y1+1)/GH + pad) };
  if ((box.x1 - box.x0) < 0.25 || (box.y1 - box.y0) < 0.25) return null;
  return box;
}

  if (!box) return src;

  const out = cropFrame.cv || (cropFrame.cv = document.createElement('canvas'));

const STRIPS = 3, STRIP_OVERLAP = 0.25;
function sliceStrips(src, strips = STRIPS) {
  const w = src.width, h = src.height;
  const band = h / strips, pad = strips > 1 ? band * STRIP_OVERLAP : 0;
  const out = [];
  for (let i = 0; i < strips; i++) {
    const y0 = Math.max(0, Math.round(i * band - pad));
    const y1 = Math.min(h, Math.round((i + 1) * band + pad));
    const c = Object.assign(document.createElement('canvas'), { width: w, height: y1 - y0 });
    c.getContext('2d').drawImage(src, 0, y0, w, y1 - y0, 0, 0, w, y1 - y0);
    out.push(c.toDataURL('image/jpeg', 0.85).split(',')[1]);
  }
  return out;
}
function sharpness(canvas) {
  const w = canvas.width, h = canvas.height;
  if (w < 8 || h < 8) return 0;
  const d = canvas.getContext('2d').getImageData(0, 0, w, h).data;
  const lum = i => d[i] * 0.299 + d[i+1] * 0.587 + d[i+2] * 0.114;
  let acc = 0, n = 0;
  for (let y = 1; y < h - 1; y += 2)
    for (let x = 1; x < w - 1; x += 2) {
      const i = (y * w + x) * 4;
      acc += Math.abs(4*lum(i) - lum(i-4) - lum(i+4) - lum(i - w*4) - lum(i + w*4));
      n++;
    }
  return n ? acc / n : 0;
}
const PLAY_RATE = 16, PLAY_LANES = 4, PLAY_MIN_DENSITY = 1.5;
async function scanByPlaying(src, dur, W, H, cx, onProg) {
  if (!('requestVideoFrameCallback' in HTMLVideoElement.prototype)) return null;
  const TW = Math.max(8, Math.round(W / 4)), TH = Math.max(8, Math.round(H / 4));
  const tcv = Object.assign(document.createElement('canvas'), { width: TW, height: TH });
  const tc = tcv.getContext('2d', { willReadFrequently: true });
  const lanes = [];
  try {
    for (let k = 0; k < PLAY_LANES; k++) {
      const v = document.createElement('video');
      v.muted = true; v.playsInline = true; v.preload = 'auto'; v.src = src;
      Object.assign(v.style, { position: 'fixed', left: '0', top: '0', width: '2px',
                               height: '2px', opacity: '0.01', pointerEvents: 'none' });
      document.body.appendChild(v);
      lanes.push(v);
    }
    await Promise.all(lanes.map(v => v.readyState >= 1 ? null : once(v, 'loadedmetadata')));
    const seen = [];
    let progress = 0;
    const playLane = async (v, from, to) => {
      await seek(v, from);
      v.playbackRate = PLAY_RATE;
      return new Promise(resolve => {
        let lastTick = Date.now(), finished = false;
        const finish = ok => {
          if (finished) return;
          finished = true; clearInterval(watch); v.pause(); resolve(ok);
        };
        const watch = setInterval(() => { if (Date.now() - lastTick > 3000) finish(false); }, 500);
        const onFrame = (_now, meta) => {
          if (finished) return;
          lastTick = Date.now();
          if (meta.mediaTime >= to) return finish(true);
          cx.drawImage(v, 0, 0, W, H);
          tc.drawImage(cx.canvas, 0, 0, W, H, 0, 0, TW, TH);
          const px = tc.getImageData(0, 0, TW, TH).data, grey = new Uint8Array(TW * TH);
          for (let i = 0; i < grey.length; i++)
            grey[i] = (px[i*4] * 0.299 + px[i*4+1] * 0.587 + px[i*4+2] * 0.114) | 0;
          seen.push({ t: meta.mediaTime, grid: motionGrid(cx, W, H), map: motionMap(cx, W, H), grey });
          progress += 1; onProg(0.6 * Math.min(1, progress / (dur * 4)), 0);
          v.requestVideoFrameCallback(onFrame);
        };
        v.requestVideoFrameCallback(onFrame);
        v.addEventListener('ended', () => finish(true), { once: true });
        v.play().catch(() => finish(false));
      });
    };
    const span = dur / PLAY_LANES;
    const oks = await Promise.all(lanes.map((v, k) =>
      playLane(v, k * span, k === PLAY_LANES - 1 ? Infinity : (k + 1) * span)));
    if (oks.includes(false)) { lanes.forEach(v => v.remove()); return null; }

    seen.sort((a, b) => a.t - b.t);
    const times = [], motion = [], thumbs = [];
    const accum = new Float32Array(GW * GH);
    let total = 0;
    for (let i = 0; i < seen.length; i++) {
      if (i > 0) {
        total += gridDiff(seen[i-1].grid, seen[i].grid);
        const a = seen[i-1].map, b = seen[i].map;
        for (let j = 0; j < accum.length; j++) accum[j] += Math.abs(b[j] - a[j]);
      }
      times.push(seen[i].t); motion.push(total); thumbs.push(seen[i].grey);
    }
    const gaps = times.some((t, i) => i > 0 && t - times[i-1] > 1.5);
    if (!times.length || times[0] > 1.5 || times[times.length - 1] < dur - 1.5 || gaps
        || times.length < Math.max(20, dur * PLAY_MIN_DENSITY)) { lanes.forEach(v => v.remove()); return null; }
    lanes.forEach(v => { v.playbackRate = 1; });
    return { times, motion, total, accum, thumbs, TW, TH, lanes };
  } catch {
    lanes.forEach(v => v.remove());
    return null;
  }
}
function thumbSharpness(grey, TW, TH, box) {
  const x0 = Math.max(1, Math.floor((box ? box.x0 : 0) * TW)), x1 = Math.min(TW - 1, Math.ceil((box ? box.x1 : 1) * TW));
  const y0 = Math.max(1, Math.floor((box ? box.y0 : 0) * TH)), y1 = Math.min(TH - 1, Math.ceil((box ? box.y1 : 1) * TH));
  let acc = 0, n = 0;
  for (let y = y0; y < y1 - 1; y++)
    for (let x = x0; x < x1 - 1; x++) {
      const i = y * TW + x;
      acc += Math.abs(4 * grey[i] - grey[i-1] - grey[i+1] - grey[i-TW] - grey[i+TW]);
      n++;
    }
  return n ? acc / n : 0;
}
async function scanBySeeking(video, W, H, cx, onProg) {
  const dur = video.duration, step = 0.25;
  const times = [], motion = [];
  const accum = new Float32Array(GW * GH);
  let prev = null, prevMap = null, total = 0;
  for (let t = 0; t < dur; t += step) {
    await seek(video, Math.min(t, dur - 0.05));
    cx.drawImage(video, 0, 0, W, H);
    const g = motionGrid(cx, W, H);
    const d = prev ? gridDiff(prev, g) : 0;
    prev = g; total += d;
    const map = motionMap(cx, W, H);
    if (prevMap) for (let i = 0; i < accum.length; i++) accum[i] += Math.abs(map[i] - prevMap[i]);
    prevMap = map;
    times.push(t); motion.push(total);
    onProg(0.6 * t / dur, 0);
  }
  return { times, motion, total, accum, thumbs: null };
}

async function extractFrames(file, budget, onProg, strips = STRIPS) {
  const video = await openVideo(file);
  const dur = video.duration;
  const W = Math.min(video.videoWidth || 720, 1080);
  const H = Math.round(W * video.videoHeight / video.videoWidth);
  const cv = Object.assign(document.createElement('canvas'), { width: W, height: H });
  const cx = cv.getContext('2d', { willReadFrequently: true });

  const scan = await scanByPlaying(video.src, dur, W, H, cx, onProg)
            || await scanBySeeking(video, W, H, cx, onProg);
  extractFrames.mode = scan.thumbs ? 'played' : 'seeked';
  const { times, motion, total, accum } = scan;
  const box = movingRegion(accum);
  lastCropBox = box;

  const picks = [times[0]];
  if (total > 1e-6) {
    const gap = total / (budget - 1);
    let want = gap;
    for (let i = 1; i < times.length; i++)
      if (motion[i] >= want && picks.length < budget - 1) { picks.push(times[i]); want = motion[i] + gap; }
  }
  const last = times[times.length - 1];
  if (picks[picks.length - 1] !== last) picks.push(last);

  const chosen = [];
  for (let i = 0; i < picks.length; i++) {
    const prevGap = i > 0 ? picks[i] - picks[i-1] : Infinity;
    const nextGap = i < picks.length - 1 ? picks[i+1] - picks[i] : Infinity;
    const reach = Math.min(SHARP_MAX, 0.25 * Math.min(prevGap, nextGap));
    let bestT = null, bestScore = -1;
    if (scan.thumbs) {
      for (let k = 0; k < times.length; k++) {
        if (Math.abs(times[k] - picks[i]) > reach + 1e-6) continue;
        const score = thumbSharpness(scan.thumbs[k], scan.TW, scan.TH, box);
        if (score > bestScore) { bestScore = score; bestT = times[k]; }
      }
    } else {
      for (let k = 0; k < SHARP_STEPS; k++) {
        const off = reach * (2 * k / (SHARP_STEPS - 1) - 1);
        const t = picks[i] + off;
        if (t < 0 || t > dur - 0.05) continue;
        await seek(video, t);
        cx.drawImage(video, 0, 0, W, H);
        const score = sharpness(cropFrame(cv, W, H, box));
        if (score > bestScore) { bestScore = score; bestT = t; }
        onProg(0.6 + 0.2 * (i + 1) / picks.length, 0);
      }
    }
    if (bestT !== null) chosen.push(bestT);
  }

  const players = scan.lanes || [video];
  const pad = scan.thumbs ? 0.001 : 0;
  const shots = new Array(chosen.length);
  let fetched = 0;
  await Promise.all(players.map(async (v, lane) => {
    for (let i = lane; i < chosen.length; i += players.length) {
      await seek(v, Math.min(chosen[i] + pad, dur - 0.05));
      cx.drawImage(v, 0, 0, W, H);
      shots[i] = sliceStrips(cropFrame(cv, W, H, box), strips);
      onProg(0.6 + 0.4 * (++fetched) / chosen.length, fetched * strips);
    }
  }));
  if (scan.lanes) scan.lanes.forEach(v => v.remove());
  const frames = shots.flat();
  frames.times = shots.flatMap((sh, i) => sh.map(() => chosen[i]));
  frames.duration = dur;
  URL.revokeObjectURL(video.src);
  return frames;
}
async function grabStrips(file, times, strips = STRIPS) {
  const video = await openVideo(file);
  const W = Math.min(video.videoWidth || 720, 1080);
  const H = Math.round(W * video.videoHeight / video.videoWidth);
  const cv = Object.assign(document.createElement('canvas'), { width: W, height: H });
  const cx = cv.getContext('2d', { willReadFrequently: true });
  const out = [];
  for (const t of times) {
    await seek(video, Math.max(0, Math.min(t, video.duration - 0.05)));
    cx.drawImage(video, 0, 0, W, H);
    out.push(sliceStrips(cropFrame(cv, W, H, lastCropBox), strips));
  }
  URL.revokeObjectURL(video.src);
  return out;
}

async function inTurn(items, fn, limit = PARALLEL) {
  const out = new Array(items.length);
  let next = 0;
  const lane = async () => {
    while (next < items.length) { const i = next++; out[i] = await fn(items[i], i); }
  };
  await Promise.all(Array.from({ length: Math.min(limit, items.length) }, lane));
  return out;
}

const modelChain = () => [MODEL, ...FALLBACKS.filter(m => m !== MODEL)];
const isBusy = e => /\b(429|500|502|503|504)\b/.test(e.message);

function waitHint(e) {
  const h = (e.message.match(/retry-after ([\d.]+)/) || [])[1];
  if (h) return Math.min(90, Math.ceil(+h));
  const retry = (e.message.match(/retry in ([\d.]+)\s*s/i) || [])[1];
  if (retry) return Math.min(90, Math.ceil(+retry));
  const inline = (e.message.match(/try again in ([\d.]+)(m?s)/i) || []);
  if (inline[1]) return Math.min(90, Math.ceil(+inline[1] * (inline[2] === 'ms' ? 0.001 : 1)));
  return 0;
}
const isDailyCap = e => /\b429\b/.test(e.message) && /per ?day|PerDay|quota/i.test(e.message);

async function withFallback(call, chain, note, paced) {
  let last;
  for (let mi = 0; mi < chain.length; mi++) {
    const model = chain[mi];
    for (let attempt = 0; attempt < 3; attempt++) {
      try {
        const rows = await call(model);
        if (mi > 0) note(model);
        return rows;
      } catch (e) {
        last = e;
        if (!isBusy(e)) throw e;
        if (isDailyCap(e)) break;
        const hinted = waitHint(e);
        if (paced || hinted) {
          const secs = hinted || 20;
          log(`rate limited — waiting ${secs}s…`);
          await new Promise(r => setTimeout(r, secs * 1000 + 500));
          continue;
        }
        if (/\b(429|503)\b/.test(e.message)) break;
        await new Promise(r => setTimeout(r, 1200 * (attempt + 1)));
      }
    }
  }
  throw last;
}

let menuEl = null, menuOwner = null;
function closeMenu() { if (menuEl) { menuEl.remove(); menuEl = null; } menuOwner = null; }

function placeMenu(input, closeIfHidden = false) {
  if (!menuEl) return;
  const b = input.getBoundingClientRect();
  if (closeIfHidden && (b.bottom < 0 || b.top > window.innerHeight)) return closeMenu();
  menuEl.style.left = b.left + 'px';
  menuEl.style.width = Math.max(b.width, 200) + 'px';
  const below = window.innerHeight - b.bottom;
  if (below < 220 && b.top > below) {
    menuEl.style.top = 'auto';
    menuEl.style.bottom = (window.innerHeight - b.top + 4) + 'px';
  } else {
    menuEl.style.bottom = 'auto';
    menuEl.style.top = (b.bottom + 4) + 'px';
  }
}
document.addEventListener('mousedown', e => {
  if (!menuEl) return;
  const t = e.target;
  if (t instanceof Node && menuEl.contains(t)) return;
  if (t instanceof Element && t.classList.contains('pickbox')) return;
  closeMenu();
});
window.addEventListener('scroll', e => {
  if (!menuEl) return;
  if (e.target instanceof Node && menuEl.contains(e.target)) return;
  if (menuOwner) placeMenu(menuOwner, true);
}, true);
window.addEventListener('resize', () => { if (menuOwner) placeMenu(menuOwner); });

function openMenu(input, onPick) {
  closeMenu();
  const q = fold(input.value);
  const all = fullRoster();
  const hits = (q ? all.filter(r => fold(r.search).includes(q) || fold(r.ingame).includes(q)
                                 || symKey(r.ingame).includes(symKey(q)))
                  : all).slice(0, 60);
  menuEl = document.createElement('div');
  menuEl.className = 'menu';
  const newLabel = input.value.trim()
    ? `New player — keep “${esc(input.value.trim())}”` : 'New player';
  menuEl.innerHTML =
    `<div data-v="\u0001new" class="newopt">${newLabel}</div><hr>`
    + (hits.length
        ? hits.map(r => { const shown = (r.ingame || r.search).trim();
            const hint = fold(shown) === fold(r.search) ? '' : ` · ${esc(r.search)}`;
            return `<div data-v="${esc(shown)}">${esc(shown)}`
                 + `<span>${esc(r.alliance || '')}${hint}</span></div>`; }).join('')
        : '<div class="none">no roster name matches that</div>');
  document.body.appendChild(menuEl);
  const first = menuEl.querySelector('div[data-v]:not(.newopt)');
  if (first) first.classList.add('on');
  menuEl.querySelectorAll('div[data-v]').forEach(d => d.onmousedown = ev => {
    ev.preventDefault();
    if (d.dataset.v === '\u0001new') { onPick(input.value.trim(), true); closeMenu(); input.focus(); return; }
    input.value = d.dataset.v; onPick(d.dataset.v, true); closeMenu();
  });
  menuOwner = input;
  placeMenu(input);
}

function wirePicker(input, onPick) {
  input.autocomplete = 'off';
  input.oninput = () => { onPick(input.value.trim(), false); openMenu(input, onPick); };
  input.onfocus  = () => openMenu(input, onPick);
  input.onclick  = () => { if (!menuEl) openMenu(input, onPick); };
  input.onkeydown = e => {
    if (!menuEl) return;
    const items = [...menuEl.querySelectorAll('div[data-v]')];
    const at = items.findIndex(d => d.classList.contains('on'));
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      e.preventDefault();
      if (!items.length) return;
      const next = e.key === 'ArrowDown' ? Math.min(at + 1, items.length - 1) : Math.max(at - 1, 0);
      items.forEach(d => d.classList.remove('on'));
      items[next].classList.add('on');
      items[next].scrollIntoView({ block: 'nearest' });
    } else if (e.key === 'Enter' && at >= 0) {
      e.preventDefault();
      if (items[at].dataset.v === '\u0001new') { onPick(input.value.trim(), true); closeMenu(); return; }
      input.value = items[at].dataset.v; onPick(input.value, true); closeMenu();
    } else if (e.key === 'Escape') closeMenu();
  };
}

const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));

function outPlayer(r) {
  if (r.match) {
    const ingame = r.match.ingame || r.match.search;
    return { search: r.match.search || ingame, ingame };
  }
  if (r.pick) {
    const all = fullRoster();
    const hit = all.find(x => (x.ingame || x.search) === r.pick)
             || all.find(x => x.search === r.pick)
             || all.find(x => fold(x.search) === fold(r.pick) && fold(r.pick));
    if (hit) return { search: hit.search || hit.ingame, ingame: hit.ingame || hit.search };
    return { search: r.pick, ingame: r.pick };
  }
  const n = r.name || r.plain;
  return { search: n, ingame: n };
}
const outName = r => outPlayer(r).ingame;

const OUT_HEADERS = ['kartz_load_date', 'kartz_submitter', 'kartz_search_name', 'kartz_ign_name',
  'kartz_alliance', 'kartz_month', 'kartz_day', 'kartz_rank', 'kartz_score'];
function loadStamp(at = new Date()) {
  const p = n => String(n).padStart(2, '0');
  return `${at.getMonth() + 1}/${at.getDate()}/${at.getFullYear()} `
       + `${p(at.getHours())}:${p(at.getMinutes())}:${p(at.getSeconds())}`;
}
const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const monthTag = (at = new Date()) => {
  const d = new Date(at.getFullYear(), at.getMonth(), at.getDate() - 7);
  return MONTHS[d.getMonth()] + String(d.getFullYear()).slice(-2);
};
function outRows() {
  const at = new Date(), stamp = loadStamp(at), month = monthTag(at);
  return rows.filter(r => !r.dropped && !r.skipped).map(r => {
    const p = outPlayer(r);
    return [stamp, $('submitter').value.trim(), p.search, p.ingame, $('alliance').value,
            month, $('kday').value, r.rank, r.points];
  });
}

function sendBlockers() {
  const out = [];
  const open = rows.filter(r => !r.dropped && (r.editing
    || (!r.match && !r.skipped && !r.confirmed && !r.pick))).length;
  if (open) out.push(`${open} row${open > 1 ? 's' : ''} to confirm`);
  const missing = [['submitter', 'submitter'], ['alliance', 'alliance'], ['kday', 'day']]
    .filter(([id]) => !$(id).value.trim()).map(([, name]) => name);
  if (missing.length) out.push('choose a ' + missing.join(', '));
  if (!outRows().length) out.push('no rows to send');
  return out;
}
function refreshSend() {
  const why = sendBlockers();
  const n = rows.filter(r => !r.dropped && !r.skipped).length;
  $('send').disabled = why.length > 0 || sending;
  const sent = !sending && lastSent && sendKey() === lastSent;
  if (!sending) $('send').textContent = sent ? sentLabel : `Send ${n} row${n === 1 ? '' : 's'} to sheet`;
  $('send').classList.toggle('done', !!sent);
  $('sheetLink').classList.toggle('hide', !sent);
  $('sendNote').textContent = why.length ? 'Before sending: ' + why.join(' · ') : '';
}
const sendKey = (values = outRows()) => JSON.stringify(values.map(v => v.slice(1)));
let sentLabel = '';
let sending = false;
let videoSaved = null;
const VIDEO_WAIT = 5 * 60 * 1000;
const VIDEO_PIECE = 8 * 1024 * 1024;
const VIDEO_QUANTUM = 256 * 1024;
let early = null;

const videoType = f => /^video\//.test(f.type) ? f.type : 'video/quicktime';
function videoName(f) {
  const d = new Date(), p = n => String(n).padStart(2, '0');
  const ext = (f.name.match(/\.[a-z0-9]{2,5}$/i) || ['.mov'])[0];
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ${$('kday').value}`
       + ` · ${$('alliance').value} · ${$('submitter').value.trim()}${ext}`;
}
async function videoLink(name, f) {
  const r = await fetch(API_BASE + '/video-session', {
    method: 'POST', headers: { 'content-type': 'application/json' },
    body: JSON.stringify({ name, type: videoType(f), size: f.size }) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok || !j.url) throw new Error(j?.error?.message || `no upload link (${r.status})`);
  return j.url;
}
async function videoPiece(url, f, from, to, signal) {
  const r = await fetch(url, { method: 'PUT', signal, body: f.slice(from, to),
    headers: { 'content-range': `bytes ${from}-${to - 1}/${f.size}` } });
  if (r.status !== 308 && !r.ok) throw new Error(`Drive refused part of the upload (${r.status})`);
  return r;
}

function startVideoUpload(f) {
  if (!f || videoSaved === f || (early && early.file === f)) return;
  const up = { file: f, mode: 'b2', key: null, failed: false };
  early = up;
  up.done = (async () => {
    try {
      const type = videoType(f);
      const r = await fetch(API_BASE + '/video-stage', {
        method: 'POST', headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ type, size: f.size }) });
      if (r.status === 501) { if (early === up) startDriveUpload(f); return; }
      const j = await r.json().catch(() => ({}));
      if (!r.ok || !j.url) throw new Error(j?.error?.message || `no staging link (${r.status})`);
      const put = await fetch(j.url, { method: 'PUT', headers: { 'content-type': type }, body: f });
      if (!put.ok) throw new Error(`B2 refused the upload (${put.status})`);
      up.key = j.key;
    } catch (e) { up.failed = true; console.warn('staging upload stopped:', e); }
  })();
}
function startDriveUpload(f) {
  const held = Math.floor((f.size - 1) / VIDEO_QUANTUM) * VIDEO_QUANTUM;
  const up = { file: f, mode: 'drive', url: null, sent: 0, held, failed: false };
  early = up;
  up.done = (async () => {
    try {
      up.url = await videoLink(`uploading — ${f.name}`, f);
      while (up.sent < held) {
        if (early !== up) return;
        const to = Math.min(up.sent + VIDEO_PIECE, held);
        await videoPiece(up.url, f, up.sent, to);
        up.sent = to;
      }
    } catch (e) { up.failed = true; console.warn('early upload stopped:', e); }
  })();
}

async function saveVideo() {
  const f = videoFile;
  if (!f || videoSaved === f) return null;
  const stop = new AbortController(), timer = setTimeout(() => stop.abort(), VIDEO_WAIT);
  const giveUp = new Promise(r => stop.signal.addEventListener('abort', r));
  try {
    const name = videoName(f);
    let up = early && early.file === f ? early : null;
    if (up) await Promise.race([up.done, giveUp]);
    up = early && early.file === f ? early : null;
    if (up && up.mode === 'drive' && up.done) await Promise.race([up.done, giveUp]);
    if (stop.signal.aborted) throw new Error('upload took too long');
    if (up && up.mode === 'b2' && up.key) {
      videoSaved = f; early = null;
      return { key: up.key, name };
    }
    if (up && up.mode === 'b2') up = null;
    if (up && !up.failed && up.url && up.sent === up.held) {
      const r = await videoPiece(up.url, f, up.held, f.size, stop.signal);
      const made = await r.json().catch(() => ({}));
      videoSaved = f; early = null;
      const rn = await fetch(API_BASE + '/video-rename', {
        method: 'POST', headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ fileId: made.id, name }) });
      if (!rn.ok) console.warn('recording saved but not renamed:', await rn.text());
      return null;
    }
    const url = await videoLink(name, f);
    const r = await fetch(url, { method: 'PUT', headers: { 'content-type': videoType(f) },
                                 body: f, signal: stop.signal });
    if (!r.ok) throw new Error(`Drive refused the upload (${r.status})`);
    videoSaved = f; early = null;
  } catch (e) {
    console.warn('recording not saved to Drive:', e);
  } finally { clearTimeout(timer); }
  return null;
}
let lastSent = '';
$('send').onclick = async () => {
  if (sendBlockers().length) return refreshSend();
  const values = outRows();
  const key = sendKey(values);
  if (key === lastSent
      && !confirm('These exact rows were already sent to the sheet. Send them again?')) return;
  sending = true; $('send').disabled = true; $('send').textContent = 'Sending…';
  let sentOk = false;
  try {
    const body = JSON.stringify({ target: 'kartz',
                                  values: values.map(r => r.map((v, i) => i === 5 ? "'" + v : v)) });
    const r = await fetch(API_BASE + '/append', {
      method: 'POST', headers: { 'content-type': 'application/json' }, body,
      keepalive: body.length < 60000 });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j?.error?.message || `sheet refused the rows (${r.status})`);
    log(`appended ${values.length} rows to Input-RawData${j.range ? ' at ' + j.range : ''}`);
    lastSent = key;
    sentLabel = `Sent ${values.length} row${values.length === 1 ? '' : 's'} to Kartz Tracker → Input-RawData`;
    const cells = (j.range || '').replace(/^.*!/, '');
    $('sheetLink').href = RAWDATA_TAB + (/^[A-Z]+\d+(:[A-Z]+\d+)?$/.test(cells) ? '&range=' + cells : '');
    sentOk = true;
  } catch (e) { log('✗ ' + e.message); }
  sending = false;
  refreshSend();
  if (sentOk) saveAfterSend();
};
async function saveAfterSend() {
  const video = await saveVideo();
  if (!video) return;
  try {
    const r = await fetch(API_BASE + '/video-commit', {
      method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify(video), keepalive: true });
    if (!r.ok) throw new Error(`the Worker refused the recording (${r.status})`);
  } catch (e) {
    videoSaved = null;
    console.warn('recording not handed over for Drive:', e);
  }
}

        : 'nothing new to remember');

};

const SUN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';

const prefersDark = matchMedia('(prefers-color-scheme: dark)');
const isDark = () => document.documentElement.dataset.theme
  ? document.documentElement.dataset.theme === 'dark' : prefersDark.matches;
function paintTheme() {
  const dark = isDark();
  for (const b of [$('theme')]) {
    b.innerHTML = dark ? SUN : MOON;
    b.title = dark ? 'Switch to light mode' : 'Switch to dark mode';
    b.setAttribute('aria-label', b.title);
  }
}

  const next = isDark() ? 'light' : 'dark';
  document.documentElement.dataset.theme = next;
  store.set('theme', next);
  paintTheme();
};

let jumpIdle = null;
function showJump() {
  const max = document.documentElement.scrollHeight - innerHeight;
  if (max < 60) return $('jump').classList.remove('on');
  $('toTop').hidden = scrollY < 80;
  $('toBottom').hidden = scrollY > max - 80;
  $('jump').classList.add('on');

  jumpIdle = setTimeout(() => $('jump').classList.remove('on'), 2500);
}
